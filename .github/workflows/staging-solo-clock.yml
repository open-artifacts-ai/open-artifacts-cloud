# M2 exit test, step 8 (staging only): proves a self-serve install's 30-day Solo
# trial ends and the $1 Solo charge is paid, with a Stripe test clock.
# The install must be listed in apps/billing's STAGING_TEST_CLOCK_INSTALLS (so
# its Stripe customer was made on a clock) and have started its Solo trial.
#   advance: attach pm_card_visa, advance the clock to trial_end + 1h, wait for
#            it, and print the proof (subscription status, invoice amount_paid,
#            currency, the Solo price, the tiers row billing's /tier answers from).
#   cleanup: delete the install's clock (Stripe deletes its customers) and reset
#            its billing rows.
# The Stripe test key is hosted-staging-deploy's STRIPE_SECRET_KEY; it never
# leaves this job (scripts/ops/staging-solo-clock.ts). Staging only, main only.
name: staging-solo-clock
run-name: staging-solo-clock ${{ inputs.action }} ${{ inputs.install_id }}

on:
  workflow_dispatch:
    inputs:
      install_id:
        description: "The staging install id (i + 11 of a-z0-9)"
        required: true
        type: string
      action:
        description: "advance the clock past the trial, or cleanup"
        required: true
        type: choice
        options:
          - advance
          - cleanup

permissions:
  contents: read

concurrency:
  group: staging-solo-clock
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    environment: hosted-staging-deploy
    timeout-minutes: 15
    steps:
      - name: Check the inputs
        env:
          REF: ${{ github.ref }}
          INSTALL_ID: ${{ inputs.install_id }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "dispatch staging-solo-clock on main"; exit 1; }
          [[ "$INSTALL_ID" =~ ^i[a-z0-9]{11}$ ]] || { echo "install_id is not an install id"; exit 1; }
          case "$ACTION" in advance | cleanup) ;; *) echo "action is advance or cleanup"; exit 1 ;; esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ops
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Load the hosted constants
        run: bash scripts/ci/hosted-constants.sh staging .github/hosted
      - name: Resolve the billing database
        env:
          TARGETS: billing
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/hosted-resource-ids.sh staging
      - name: Stripe test clock
        env:
          INSTALL_ID: ${{ inputs.install_id }}
          ACTION: ${{ inputs.action }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types --no-warnings scripts/ops/staging-solo-clock.ts
