# Opens the pin-bump PR (cloud #20): when public has a stable release newer than
# PUBLIC_PIN, one PR moves PUBLIC_PIN and SYNCED_FROM to it and regenerates the
# merged lockfile in the overlay. The PR is opened with the release App's token,
# because a PR made with GITHUB_TOKEN starts no CI. Everything it does is
# reviewed by CI: pin-check's port check and equivalence run on the PR as on
# any other. This workflow never arms or merges, and never opens a second PR:
# while any pin-bump/* PR is open, or a PR already took the newest tag (open,
# merged or closed), it does nothing. A failure at any step fails the run.
name: pin-bump

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pin-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: private
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: private/.nvmrc
      - id: plan
        name: Is there a newer public release with no PR
        working-directory: private
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts plan --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ steps.plan.outputs.sha }}
          path: public
          persist-credentials: false
      - if: steps.plan.outputs.bump == 'true'
        name: Move the pin files
        working-directory: private
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts apply --tag "$TAG" --sha "$SHA"
      # overlay.sh checks that public's HEAD is the new pin's sha.
      - if: steps.plan.outputs.bump == 'true'
        name: Overlay (checks the pin; strict or pre-split from the pinned tree)
        run: private/scripts/overlay.sh --auto-split public private
      - if: steps.plan.outputs.bump == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: public/package.json
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      # The overlay holds this repo's merged lockfile; the install updates it in
      # place for the new public importers (README, "Bumping the pin").
      - if: steps.plan.outputs.bump == 'true'
        name: Regenerate the merged lockfile
        working-directory: public
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          cp pnpm-lock.yaml ../private/pnpm-lock.yaml
      - id: app
        if: steps.plan.outputs.bump == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.plan.outputs.bump == 'true'
        name: Commit and push the branch
        working-directory: private
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add PUBLIC_PIN SYNCED_FROM pnpm-lock.yaml
          git commit -m "chore(pin): bump PUBLIC_PIN to $TAG"
          # plan found no PR, open or closed, for this branch, so a leftover
          # branch from a run that died before opening one is safe to replace.
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"
      - if: steps.plan.outputs.bump == 'true'
        name: Open the PR (never armed)
        working-directory: private
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts open-pr --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA" --branch "$BRANCH"
