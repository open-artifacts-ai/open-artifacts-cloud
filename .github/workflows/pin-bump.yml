# Opens the pin-bump PR (cloud #20): when public has a stable release newer than
# PUBLIC_PIN, one PR moves PUBLIC_PIN and SYNCED_FROM to it and carries the
# merged lockfile regenerated in the overlay. The PR is opened with the release
# App's token, because a PR made with GITHUB_TOKEN starts no CI. CI then judges
# it as any other: pin-check's port check and equivalence. This workflow never
# arms or merges, and never opens a second PR: while any pin-bump/* PR is open,
# or a PR already took the newest tag (open, merged or closed), it does nothing.
# One exception (#425): an open bump for an older tag that is red and not armed
# is closed, with a comment, and replaced by the bump to the newest release.
# CI runs once for the bump: the required checks pass at once on the PR (ci.yml,
# scripts/ci/pin-only.ts) and the full suite runs in the merge queue, on the commit
# that lands. If that run fails, the PR leaves the queue and stays un-armed
# (pin-bump-arm.yml); the stale rule below is what finally turns this run red.
# An open pin-bump PR older than STALE_PR_MS (3 days) turns the run red, so a
# stuck PR cannot quietly block later releases.
#
# Three jobs, so the public tree's install never runs beside the App key:
# - prepare: no secrets. Plans, moves the pin files, overlays the public tree,
#   runs `pnpm install --lockfile-only` (it reads the public tree's pnpmfile,
#   npmrc and workspace config, so it is inside no trust boundary) and uploads
#   pnpm-lock.yaml, as data, and nothing else.
#   It then runs the public workspace's dependency install and build code
#   (--ignore-scripts, but the build is public code), so NOTHING from this job is
#   trusted beyond its two artifacts, and `open` re-validates both as data. A
#   future cache in any job that holds secrets would make this cache poisoning,
#   so none may be added.
#   It also derives the surfaces port's mechanical files (tests/redline/live/manifest.json,
#   test/cases-added.ts and the counts in test/surfaces.test.ts) from the overlaid
#   tree's src/surfaces.ts, with an install that runs no scripts, and uploads only
#   the resulting plan (case names and counts) as data.
# - open: a fresh runner on main's checkout. It never checks out or runs the
#   public tree, and never installs. It plans again itself (nothing from
#   prepare but the lockfile and the plan are trusted), re-applies the pin files,
#   takes the lockfile as data, applies the plan with main's own
#   tests/redline/scripts/redline-regen.ts (which accepts only plain case names), and only then mints the App token to push and open the PR.
# - report: issues: write, no checkout. Red keeps one `blocker` issue titled
#   "pin-bump failed" open with the run URL; green closes it. A run past its
#   timeout is reported as cancelled, so cancelled counts as red: anything but
#   success is red, except an `open` skipped because there was nothing to bump.
#
# Direct mode (cloud #264): with the repo variable PIN_BUMP_DIRECT set to `on`,
# both plans run `plan-direct` (no PR is read), and `open` lands the same
# App-signed commit on main itself instead of pushing a branch and opening a PR:
# `pin-bump.ts land` moves main with force=false, and refuses unless the commit's
# one parent is the checked-out main sha, it changes only the pin files, and both
# pin files name the planned tag and sha. A main that moved on a
# lockfile-sensitive path is refused (red; the next run regenerates); any other
# move gets the same blobs recommitted on main's head. It needs the release App
# as a bypass actor on main's ruleset. Unset (or anything but `on`), nothing
# changes: the PR path below runs exactly as before.
name: pin-bump

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pin-bump
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: private
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: private/.nvmrc
      - id: plan
        name: Is there a newer public release to take
        working-directory: private
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.PIN_BUMP_DIRECT == 'on' && 'plan-direct' || 'plan' }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts "$MODE" --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ steps.plan.outputs.sha }}
          path: public
          persist-credentials: false
      - if: steps.plan.outputs.bump == 'true'
        name: Move the pin files
        working-directory: private
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts apply --tag "$TAG" --sha "$SHA"
      # overlay.sh checks that public's HEAD is the new pin's sha.
      - if: steps.plan.outputs.bump == 'true'
        name: Overlay (checks the pin; strict or pre-split from the pinned tree)
        run: private/scripts/overlay.sh --auto-split public private
      - if: steps.plan.outputs.bump == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: public/package.json
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      # The overlay holds this repo's merged lockfile; the install updates it in
      # place for the new public importers (README, "Bumping the pin").
      - if: steps.plan.outputs.bump == 'true'
        name: Regenerate the merged lockfile
        working-directory: public
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          mkdir -p "$RUNNER_TEMP/lock"
          cp pnpm-lock.yaml "$RUNNER_TEMP/lock/pnpm-lock.yaml"
      # Only the lockfile and the surfaces plan leave this job, and open takes them as data.
      # The lockfile is uploaded before any public build code runs, and v4
      # artifacts can't be overwritten by name, so the build can't swap it.
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pin-bump-lock-${{ steps.plan.outputs.tag }}
          path: ${{ runner.temp }}/lock/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      # The mechanical half of a surfaces port, derived from the overlaid tree's
      # src/surfaces.ts (tests/redline/src/regen.ts). The install runs no
      # lifecycle scripts. A route that still needs its classification is a
      # warning here and a named failure in CI (tests/redline/test/regen.test.ts).
      - if: steps.plan.outputs.bump == 'true'
        name: Plan the surfaces port (manifest, cases-added, counts)
        working-directory: public
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter "@oa/redline^..." build
          mkdir -p "$RUNNER_TEMP/regen"
          cd tests/redline
          node --experimental-strip-types --no-warnings scripts/redline-regen.ts plan --out "$RUNNER_TEMP/regen/plan.json"
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pin-bump-regen-${{ steps.plan.outputs.tag }}
          path: ${{ runner.temp }}/regen/plan.json
          if-no-files-found: error
          retention-days: 1

  open:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.bump == 'true'
    runs-on: ubuntu-latest
    environment: release-app
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Planned again here: the tag and sha used below are this job's own.
      - id: plan
        name: Plan again
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.PIN_BUMP_DIRECT == 'on' && 'plan-direct' || 'plan' }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts "$MODE" --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.bump == 'true'
        name: Move the pin files
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts apply --tag "$TAG" --sha "$SHA"
      # By this run's own tag: a lockfile built for another tag is not found.
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pin-bump-lock-${{ steps.plan.outputs.tag }}
          path: ${{ runner.temp }}/lock
      - if: steps.plan.outputs.bump == 'true'
        name: Take the lockfile as data
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/lock/pnpm-lock.yaml"
          [ -f "$f" ] && [ ! -L "$f" ] || { echo "::error::no regular pnpm-lock.yaml in the artifact"; exit 1; }
          [ "$(wc -c < "$f")" -le 10000000 ] || { echo "::error::the lockfile is over 10 MB"; exit 1; }
          cp "$f" pnpm-lock.yaml
      - if: steps.plan.outputs.bump == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pin-bump-regen-${{ steps.plan.outputs.tag }}
          path: ${{ runner.temp }}/regen
      # The plan is data: main's own script validates every case name (plain
      # printable text, no quote, backtick, backslash or dollar sign) and writes the
      # three files from fixed templates. Nothing from the public tree runs here.
      - if: steps.plan.outputs.bump == 'true'
        name: Apply the surfaces plan as data
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/regen/plan.json"
          [ -f "$f" ] && [ ! -L "$f" ] || { echo "::error::no regular plan.json in the artifact"; exit 1; }
          [ "$(wc -c < "$f")" -le 2000000 ] || { echo "::error::the plan is over 2 MB"; exit 1; }
          node --experimental-strip-types --no-warnings tests/redline/scripts/redline-regen.ts apply --plan "$f" --dir tests/redline
      - id: app
        if: steps.plan.outputs.bump == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The commit is made through the git-data API with the App token, never with
      # local git: GitHub then records the App's bot as author and committer and
      # signs it (verified), and the push needs only the App's contents write.
      - id: commit
        if: steps.plan.outputs.bump == 'true'
        name: Commit the pin (App-signed, through the API)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          entries='[]'
          for f in PUBLIC_PIN SYNCED_FROM pnpm-lock.yaml tests/redline/live/manifest.json tests/redline/test/cases-added.ts tests/redline/test/surfaces.test.ts; do
            base64 < "$f" | tr -d '\n' | jq -Rs '{content: ., encoding: "base64"}' > "$RUNNER_TEMP/blob.json"
            blob=$(gh api "repos/$REPO/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
            entries=$(jq -c --arg p "$f" --arg s "$blob" '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<< "$entries")
          done
          base_tree=$(gh api "repos/$REPO/git/commits/$BASE" --jq .tree.sha)
          jq -n --arg b "$base_tree" --argjson e "$entries" '{base_tree: $b, tree: $e}' > "$RUNNER_TEMP/tree.json"
          tree=$(gh api "repos/$REPO/git/trees" --input "$RUNNER_TEMP/tree.json" --jq .sha)
          jq -n --arg m "chore(pin): bump PUBLIC_PIN to $TAG" --arg t "$tree" --arg p "$BASE" '{message: $m, tree: $t, parents: [$p]}' > "$RUNNER_TEMP/commit.json"
          commit=$(gh api "repos/$REPO/git/commits" --input "$RUNNER_TEMP/commit.json" --jq .sha)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "committed $commit on $BASE"
      - if: steps.plan.outputs.bump == 'true' && vars.PIN_BUMP_DIRECT != 'on'
        name: Push the branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          commit="$COMMIT"
          # plan found no PR, open or closed, for this branch, so a leftover
          # branch from a run that died before opening one is safe to replace.
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" > /dev/null
          fi
          echo "pushed $BRANCH at $commit"
      - if: steps.plan.outputs.bump == 'true' && vars.PIN_BUMP_DIRECT != 'on'
        name: Open the PR (never armed)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          SUPERSEDE: ${{ steps.plan.outputs.supersede }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts open-pr --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA" --branch "$BRANCH" --supersede "$SUPERSEDE"
      # Direct mode: main itself moves to the pin commit, with no PR and no queue.
      - if: steps.plan.outputs.bump == 'true' && vars.PIN_BUMP_DIRECT == 'on'
        name: Land the pin on main (direct mode)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ github.sha }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: node --experimental-strip-types scripts/ci/pin-bump.ts land --repo "$GITHUB_REPOSITORY" --base "$BASE" --commit "$COMMIT" --tag "$TAG" --sha "$SHA"

  report:
    needs: [prepare, open]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Keep the blocker issue in step
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ (needs.prepare.result != 'success' || needs.open.result == 'failure' || needs.open.result == 'cancelled') && 'failure' || 'success' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="pin-bump failed"
          open=$(gh issue list --repo "$REPO" --state open --label blocker --limit 100 --json number,title --jq "[.[] | select(.title == \"$title\") | .number][0] // empty")
          if [ "$RESULT" = failure ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$REPO" --body "Failed again: $RUN"
            else
              labels=$(gh label list --repo "$REPO" --limit 200 --json name --jq '.[].name')
              grep -qx blocker <<< "$labels" || gh label create blocker --repo "$REPO" --description "Blocks a release or a merge" --color B60205
              gh issue create --repo "$REPO" --title "$title" --label blocker --body "The pin-bump workflow failed: $RUN"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$REPO" --comment "Green again: $RUN"
          fi
