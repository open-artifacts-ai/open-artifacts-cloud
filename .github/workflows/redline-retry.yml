# Reruns a red release gate once, on its own (cloud #428, #264). A release
# gate is a redline-staging run started by workflow_dispatch on main (the
# nightly and the dry run call it, so their runs belong to other workflows).
# When attempt 1 of one ends in failure, this reruns the WHOLE run (every job,
# never --failed), so a flake can't hide behind a partial rerun. Attempt 2 is
# never retried: red there waits for a person. Each retry leaves a comment on
# the tracking issue with the run link, so every flake that needed it is seen.
# The rerun uses the release App's token (actions: write, this repo only),
# minted in the main-only release-app Environment, so its completion starts
# prod-release-chain as a person's rerun does.
name: redline-retry
on:
  workflow_run:
    workflows: [redline-staging]
    types: [completed]
permissions: {}
concurrency:
  group: redline-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: release-app
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Rerun the whole gate once
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run rerun "$RUN_ID" --repo "$REPO"
          echo "reran redline-staging run $RUN_ID (attempt 2)"
      - name: Note it on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.event.workflow_run.html_url }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          gh issue comment 428 --repo "$REPO" --body "Automatic rerun: $TITLE attempt 1 failed, $URL. Attempt 2 started; find the failed case in attempt 1 and fix it."
