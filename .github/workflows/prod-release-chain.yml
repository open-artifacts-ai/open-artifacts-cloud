# The automatic prod release chain (#1343). When a red-line run passes for an
# exact release tag, the chain deploys that tag to the prod platform with no
# human step; the scheduler's fleet duty (#955) then upgrades the canary, leo
# and the rest, each soaking first (apps/scheduler/src/provapi/fleet.ts).
# Forward only: nothing here rolls back. docs/ops/hosted.md has the halts and
# how one clears.
#
# Off until reviewed: the chain runs only with the repo variable
# PROD_RELEASE_CHAIN set to "on". The fleet has its own switch, prod's
# FLEET_CANARY in apps/scheduler/wrangler.jsonc.
#
# Event-driven (cloud #264): no step waits, sleeps or polls for a run. Each
# step starts on a completed workflow_run event, starts the next workflow and
# ends; that workflow's own completion is the next event:
#   redline-staging green  -> gate, then dispatch hosted-publish (env prod)
#                             or, when prod's bucket has the release, the deploy
#   that publish completed -> deploy: check it, then dispatch the deploy
#   that deploy completed  -> finish: check it; report keeps the blocker issue
# The plan job classifies the event from its own fields through env, never
# into a script (scripts/ci/prod-release-chain.ts plan): the switch is on, the
# run is on main and this repository's, and either a green dispatched
# redline-staging run (the nightly calls it, so its runs never count) or a
# hosted-publish or deploy-hosted-platform run this chain dispatched: event
# workflow_dispatch, the release App's bot, and the chain's run name for the
# tag (`hosted-publish prod <tag> [p<run>-<n>]`, `deploy-hosted-platform prod
# <tag> [c<run>-<n>]`). Every other event (a staging copy or deploy, a manual
# run, a floor) starts nothing.
#
# The gate's tag comes only from the red-line run's display title
# (redline-staging.yml's run-name). Then main's own scripts prove it again:
# staging-first-gate.sh, staging-smoke-gate.sh (#1406: staging's post-deploy
# smoke is green at or after the tag) and tag-passed-checks.sh prod (a
# failure is red). Then two checks that skip, green with a notice, without
# touching the blocker issue: this event is the newest green run for the tag
# (else it is stale), and the tag is newer than the release prod's scheduler
# runs (else prod already has it).
#
# The deploy is deploy-hosted-platform.yml itself, dispatched on main with env
# prod and every target (scripts/ci/chain-dispatch.ts), so all its gates and
# the platform-tags.sh read-back run unchanged, every secret comes from its
# own Environment, and its concurrency group serializes it against a manual
# deploy; require_newer re-checks the tag against prod once the run holds
# that group, so a manual deploy of a newer tag is never downgraded. Before
# it, the chain dispatches hosted-publish.yml for the tag (env prod) unless
# prod's bucket has the release already (#1412: hosted-publish publishes
# staging alone after a release; prod's bucket waits for this red-line). The
# deploy starts only after the chain's publish of the tag ended green and
# prod's bucket has its record (prod-release-chain.ts child, then start).
# The scheduler deploys last there, so a run that stops before the scheduler
# step never moves the fleet; once that step's first deploy has run, the fleet
# follows even if the run goes red afterwards.
#
# Dispatches use the release App's installation token (actions: write, minted
# in the main-only release-app Environment), never the default token: GitHub
# raises no workflow_run event for a run the default token started, so the
# chain's next step would never fire. Never twice: the start and deploy jobs
# share a concurrency group keyed on the tag and start nothing while the
# chain's publish or deploy of the tag is queued or running, or once its
# deploy succeeded (prod-release-chain.ts start). A child's end is read again
# by run id, so a rerun of it in progress starts nothing and reports nothing:
# its own end is the next event. release-retry.yml reruns a failed child
# itself.
#
# A red step keeps one `blocker` issue open; the deploy's green end closes it.
name: prod-release-chain

on:
  workflow_run:
    workflows: [redline-staging, hosted-publish, deploy-hosted-platform]
    types: [completed]
    branches: [main]

# The public repo: the release and smoke gates read its releases, its tag
# commit, its release-please run and its deploy-staging.yml smoke from here;
# everything hosted (jobs, assets, red-line runs) is this repo's own.
env:
  PUBLIC_REPO: open-artifacts-ai/open-artifacts

permissions: {}

# No run-level concurrency group: GitHub keeps one pending run per group, so
# an unrelated completion (a staging deploy) would replace a pending step and
# its event would be lost. The jobs that start something hold the tag's group.

jobs:
  # What this event starts, from the event's own fields (no API call).
  plan:
    if: ${{ vars.PROD_RELEASE_CHAIN == 'on' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      step: ${{ steps.plan.outputs.step }}
      tag: ${{ steps.plan.outputs.tag }}
      child: ${{ steps.plan.outputs.child }}
    steps:
      # workflow_run runs on the default branch; refuse anything else.
      - name: On main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "the chain runs on main only"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: plan
        name: What this event starts
        env:
          SWITCH: ${{ vars.PROD_RELEASE_CHAIN }}
          # The file, not the name: a run-name replaces the name.
          WORKFLOW: ${{ github.event.workflow_run.path }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts plan --repo "$GITHUB_REPOSITORY" --switch "$SWITCH" --workflow "$WORKFLOW" --conclusion "$CONCLUSION" --event "$RUN_EVENT" --branch "$BRANCH" --head-repo "$HEAD_REPO" --title "$TITLE" --actor "$ACTOR" --run-id "$RUN_ID"

  gate:
    needs: plan
    if: needs.plan.outputs.step == 'gate'
    runs-on: ubuntu-latest
    # The prod deploy token, for one read: the scheduler's release tag.
    environment: hosted-prod-deploy
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # "true" only when this event is fresh and the tag is newer than prod's.
      go: ${{ steps.fresh.outputs.go == 'true' && steps.newer.outputs.go == 'true' }}
    steps:
      # workflow_run runs on the default branch; refuse anything else.
      - name: On main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "the chain runs on main only"; exit 1; }'
      # main's scripts and constants only.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
            .github/hosted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The run's title is the only source of the tag, checked against
      # redline-staging.yml's run-name before anything uses it.
      - id: tag
        name: The tag, from the red-line run's name
        env:
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts tag --title "$TITLE" >> "$GITHUB_OUTPUT"
      - name: Staging passed this tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/staging-first-gate.sh "$TAG"
      # #1406: and staging's post-deploy smoke is green at or after the tag.
      - name: Staging's smoke is green at or after this tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/staging-smoke-gate.sh "$TAG"
      - name: The tag passed every earlier check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/tag-passed-checks.sh prod "$TAG"
      # A stale event (a newer green run for the tag) skips: that run's own
      # event acts instead.
      - id: fresh
        name: This event is the newest green run for the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go="$(node --experimental-strip-types scripts/ci/prod-release-chain.ts fresh --repo "$GITHUB_REPOSITORY" --tag "$TAG" --head-sha "$HEAD_SHA")"
          printf '%s\n' "$go" >> "$GITHUB_OUTPUT"
          [ "$go" = go=true ] || echo "::notice title=Release chain skipped::a newer green red-line run for $TAG exists; this event is stale"
      - name: Load the hosted constants
        if: steps.fresh.outputs.go == 'true'
        run: bash scripts/ci/hosted-constants.sh prod .github/hosted > /dev/null
      # A release prod already runs (a repeated red-line, a re-run) skips.
      - id: newer
        name: The tag is newer than prod's
        if: steps.fresh.outputs.go == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          current="$(bash scripts/ci/worker-tag.sh prod scheduler)"
          go="$(node --experimental-strip-types scripts/ci/prod-release-chain.ts newer --tag "$TAG" --current "$current")"
          printf '%s\n' "$go" >> "$GITHUB_OUTPUT"
          [ "$go" = go=true ] || echo "::notice title=Release chain skipped::prod already runs $current; $TAG is not newer"
  # After the gate: dispatch hosted-publish.yml for the tag (env prod), or the
  # deploy at once when prod's bucket has the release (publishing is
  # create-only), and end. A plain dispatched run, not a reusable-workflow
  # call: the caller must pass each secret by name or it resolves empty (run
  # 42109047045), and a `uses:` job cannot set an Environment. See
  # chain-dispatch.ts.
  start:
    needs: [plan, gate]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The release App key lives here (#302): main only.
    environment: release-app
    # The job's own token only reads; the App's token dispatches.
    permissions:
      contents: read
      actions: read
    concurrency:
      group: prod-release-chain-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    timeout-minutes: 10
    outputs:
      next: ${{ steps.start.outputs.next }}
      note: ${{ steps.dispatch.outputs.deploy_note }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
            .github/hosted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: start
        name: What the chain starts for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts start --repo "$GITHUB_REPOSITORY" --after gate --tag "$TAG"
      - id: app
        name: Mint the dispatch token
        if: steps.start.outputs.go == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
      - id: dispatch
        name: Dispatch the prod publish, or the deploy when prod's bucket has the release
        if: steps.start.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          NEXT: ${{ steps.start.outputs.next }}
          CHAIN_ID: ${{ steps.start.outputs.next == 'publish' && 'p' || 'c' }}${{ github.run_id }}-${{ github.run_attempt }}
        run: node --experimental-strip-types scripts/ci/chain-dispatch.ts --workflow "$NEXT" --repo "$GITHUB_REPOSITORY" --tag "$TAG" --chain-id "$CHAIN_ID"
  # After the chain's prod publish of a tag completed: it must have ended
  # green, for that tag, as the chain's own run, and prod's bucket must have
  # the release; then dispatch the deploy and end.
  deploy:
    needs: plan
    if: needs.plan.outputs.step == 'deploy'
    runs-on: ubuntu-latest
    environment: release-app
    permissions:
      contents: read
      actions: read
    concurrency:
      group: prod-release-chain-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    timeout-minutes: 10
    outputs:
      url: ${{ steps.child.outputs.url }}
      note: ${{ steps.child.outputs.note || steps.dispatch.outputs.deploy_note }}
    steps:
      - name: On main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "the chain runs on main only"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
            .github/hosted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: child
        name: The chain's prod publish of the tag ended green
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          CHILD: ${{ needs.plan.outputs.child }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts child --repo "$GITHUB_REPOSITORY" --workflow publish --run-id "$CHILD" --tag "$TAG"
      - id: start
        name: What the chain starts for the tag
        if: steps.child.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts start --repo "$GITHUB_REPOSITORY" --after publish --tag "$TAG"
      - id: app
        name: Mint the dispatch token
        if: steps.start.outputs.go == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
      - id: dispatch
        name: Dispatch the prod deploy
        if: steps.start.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          CHAIN_ID: c${{ github.run_id }}-${{ github.run_attempt }}
        run: node --experimental-strip-types scripts/ci/chain-dispatch.ts --repo "$GITHUB_REPOSITORY" --tag "$TAG" --chain-id "$CHAIN_ID"
  # After the chain's prod deploy of a tag completed: the chain's end.
  finish:
    needs: plan
    if: needs.plan.outputs.step == 'report'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      state: ${{ steps.child.outputs.state }}
      url: ${{ steps.child.outputs.url }}
      note: ${{ steps.child.outputs.note }}
    steps:
      - name: On main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "the chain runs on main only"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: child
        name: The chain's prod deploy of the tag ended green
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          CHILD: ${{ needs.plan.outputs.child }}
        run: node --experimental-strip-types scripts/ci/prod-release-chain.ts child --repo "$GITHUB_REPOSITORY" --workflow deploy --run-id "$CHILD" --tag "$TAG"
  report:
    needs: [plan, gate, start, deploy, finish]
    # Every step the plan started reports, and a failed plan too: the chain
    # never fails quietly. An event that starts nothing reports nothing.
    if: ${{ always() && needs.plan.result != 'skipped' && (needs.plan.result != 'success' || needs.plan.outputs.step != 'none') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Keep the blocker issue in step
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          # One result from the jobs (prod-release-chain.ts result): red opens
          # or refreshes the issue, only the deploy's green end closes it, and
          # a skip or a started next step leaves it.
          STEP: ${{ needs.plan.outputs.step }}
          PLAN: ${{ needs.plan.result }}
          GATE: ${{ needs.gate.result }}
          START: ${{ needs.start.result }}
          DEPLOY: ${{ needs.deploy.result }}
          FINISH: ${{ needs.finish.result }}
          STATE: ${{ needs.finish.outputs.state }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The run that ended: the deploy, or the publish (empty after the gate).
          DEPLOY_RUN: ${{ needs.finish.outputs.url || needs.deploy.outputs.url }}
          # Why it failed, e.g. the run's conclusion or a refused dispatch.
          DEPLOY_NOTE: ${{ needs.finish.outputs.note || needs.deploy.outputs.note || needs.start.outputs.note }}
        run: |
          set -euo pipefail
          result="$(node --experimental-strip-types scripts/ci/prod-release-chain.ts result --step "$STEP" --plan "$PLAN" --gate "$GATE" --start "$START" --deploy "$DEPLOY" --finish "$FINISH" --state "$STATE")"
          node --experimental-strip-types scripts/ci/prod-release-chain.ts report --repo "$GITHUB_REPOSITORY" --tag "$TAG" --result "$result" --run "$RUN" --deploy-run "$DEPLOY_RUN" --deploy-note "$DEPLOY_NOTE"
