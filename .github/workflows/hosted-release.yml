name: hosted-release
# Mirrors a public release into this repo, then builds, signs and attaches the
# hosted release files (#1056, cut-over step C3). They moved here from the
# public repo's release-please.yml (hosted-guard, hosted-build, hosted-check,
# hosted-sign-*, hosted-attach-*); the steps are the same, except that the tree
# is the overlay (public at PUBLIC_PIN, this repo on top) and the files are
# attached to this repo's release.
#
# Trigger: workflow_dispatch only, for now. The push-on-PUBLIC_PIN trigger
# comes at cut-over step F2, with the first real release from here.
#
# dry_run (the default): the mirror only reads and checks; the build and the
# staging signing run; the prod key is never touched; nothing creates a tag or
# a release or attaches anything. The signed staging release files are
# re-assembled (assemble-release.mjs checks the signature against the pinned
# key) and uploaded as the workflow artifact hosted-signed-staging-dry-run.
# The run is named "(dry run)": tag-passed-checks.sh never counts such a run.
# dry_run=false needs main and creates the tag and the release.
run-name: ${{ inputs.dry_run && 'hosted-release (dry run)' || 'hosted-release' }}
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Build and sign with the staging key, then stop before creating the tag
          and release and before attaching. The signed files are uploaded as a
          workflow artifact.
        required: true
        type: boolean
        default: true
# No workflow-wide grant: every job sets its own permissions. Only
# hosted-attach-* may write contents; the mirror writes with the release App's
# token, never GITHUB_TOKEN.
permissions: {}
env:
  # The public repo the pinned release comes from. Read-only: this workflow
  # never writes there.
  PUBLIC_REPO: open-artifacts-ai/open-artifacts
jobs:
  # Checks that PUBLIC_PIN names a real, published, green public release; then
  # (not in a dry run) creates the tag vX.Y.Z on this commit and its release.
  # The tag ruleset lets only the release App create tags, and no one change or
  # delete them (rulesets A and B).
  mirror:
    if: ${{ inputs.dry_run || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: hosted-release-mirror
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      public_sha: ${{ steps.pin.outputs.public_sha }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: pin
        name: Read PUBLIC_PIN
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^tag=//p' PUBLIC_PIN)
          sha=$(sed -n 's/^sha=//p' PUBLIC_PIN)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::PUBLIC_PIN tag '$tag' is not a stable vX.Y.Z"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PUBLIC_PIN sha '$sha' is not a full sha"; exit 1; }
          { echo "tag=$tag"; echo "public_sha=$sha"; } >> "$GITHUB_OUTPUT"
      # Reads only, on the public repo (public data: GITHUB_TOKEN is enough).
      - name: The public release is published, on public main, and green
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          PUB_SHA: ${{ steps.pin.outputs.public_sha }}
        run: |
          set -euo pipefail
          P="repos/$PUBLIC_REPO"
          rel=$(gh api "$P/releases/tags/$TAG")
          [ "$(jq -r .draft <<< "$rel")" = false ] || { echo "::error::public release $TAG is a draft"; exit 1; }
          [ "$(jq -r .prerelease <<< "$rel")" = false ] || { echo "::error::public release $TAG is a pre-release"; exit 1; }
          [ -n "$(jq -r '.published_at // empty' <<< "$rel")" ] || { echo "::error::public release $TAG is not published"; exit 1; }
          # The tag resolves (through annotated tags) to the pinned commit.
          ref=$(gh api "$P/git/ref/tags/$TAG")
          sha=$(jq -r .object.sha <<< "$ref")
          type=$(jq -r .object.type <<< "$ref")
          for _ in 1 2 3 4; do
            [ "$type" = tag ] || break
            obj=$(gh api "$P/git/tags/$sha")
            sha=$(jq -r .object.sha <<< "$obj")
            type=$(jq -r .object.type <<< "$obj")
          done
          [ "$type" = commit ] && [ "$sha" = "$PUB_SHA" ] || { echo "::error::public $TAG is $sha, but PUBLIC_PIN says $PUB_SHA"; exit 1; }
          main_sha=$(gh api "$P/git/ref/heads/main" -q .object.sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read public main"; exit 1; }
          status=$(gh api "$P/compare/$main_sha...$PUB_SHA" -q .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::public $TAG ($PUB_SHA) is not on public main (compare: $status)"; exit 1 ;;
          esac
          version=$(gh api -H "Accept: application/vnd.github.raw+json" "$P/contents/package.json?ref=$PUB_SHA" | jq -r .version)
          [ "$version" = "${TAG#v}" ] || { echo "::error::public package.json at $PUB_SHA is $version, not ${TAG#v}"; exit 1; }
          # L5: the pinned commit is the public release commit itself: the
          # release's target (when a SHA), and the commit where package.json's
          # version changed versus its first parent.
          target=$(jq -r '.target_commitish // empty' <<< "$rel")
          if [[ "$target" =~ ^[0-9a-f]{40}$ ]] && [ "$target" != "$PUB_SHA" ]; then
            echo "::error::public $TAG points at $PUB_SHA but its release targets $target"; exit 1
          fi
          parent=$(gh api "$P/commits/$PUB_SHA" -q '.parents[0].sha')
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read the first parent of public $PUB_SHA"; exit 1; }
          prev=$(gh api -H "Accept: application/vnd.github.raw+json" "$P/contents/package.json?ref=$parent" | jq -r .version)
          [ "$prev" != "$version" ] || { echo "::error::public package.json's version did not change in $PUB_SHA; not the release commit"; exit 1; }
          # The public release run of that commit: release-please and verify-release green.
          runs=$(gh api "$P/actions/workflows/release-please.yml/runs?event=push&branch=main&head_sha=$PUB_SHA&per_page=100")
          run_id=$(jq -r --arg s "$PUB_SHA" '[.workflow_runs[] | select(.head_sha == $s and .event == "push")] | sort_by(.created_at) | last | .id // empty' <<< "$runs")
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::no public release-please push run for $PUB_SHA"; exit 1; }
          jobs=$(gh api "$P/actions/runs/$run_id/jobs?filter=latest&per_page=100")
          for j in release-please verify-release; do
            got=$(jq -r --arg n "$j" '[.jobs[] | select(.name == $n)] | if length == 1 then (.[0].conclusion // "not completed") else "missing" end' <<< "$jobs")
            [ "$got" = success ] || { echo "::error::public job $j: $got (run $run_id)"; exit 1; }
          done
          echo "public $TAG ($PUB_SHA) is published, on main, and green (run $run_id)"
      - name: Dry run, stopping before the tag
        if: ${{ inputs.dry_run }}
        run: echo "dry run, so no tag and no release are created"
      - id: app
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # A new tag is this commit, which must be main's head. An existing tag
      # must already be this commit (a re-run, even after main moved, as long
      # as the commit is still on main); a different one stops the run.
      - name: Create the tag and the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.pin.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          if existing=$(gh api "repos/$REPO/git/ref/tags/$TAG" 2> /dev/null); then
            # A re-run: the tag is already this commit, and main may have moved on.
            [ "$(jq -r .object.type <<< "$existing")" = commit ] && [ "$(jq -r .object.sha <<< "$existing")" = "$SHA" ] \
              || { echo "::error::tag $TAG already exists and is not $SHA"; exit 1; }
            status=$(gh api "repos/$REPO/compare/$main_sha...$SHA" -q .status)
            case "$status" in
              behind|identical) ;;
              *) echo "::error::$SHA is not on main (compare: $status)"; exit 1 ;;
            esac
            echo "tag $TAG already points at $SHA"
          else
            [ "$main_sha" = "$SHA" ] || { echo "::error::$SHA is not the head of main ($main_sha); dispatch again from main's head"; exit 1; }
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null
            echo "created tag $TAG at $SHA"
          fi
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
              --notes "Hosted build of $PUBLIC_REPO $TAG. The signed hosted release files are attached by hosted-release.yml."
          fi
  # Stable releases only. Resolves what to build: the tag's commit in this repo
  # (a dry run has no tag: this commit), on main, whose PUBLIC_PIN is the
  # release the mirror checked.
  hosted-guard:
    needs: [mirror]
    if: ${{ !cancelled() && needs.mirror.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      public_sha: ${{ steps.resolve.outputs.public_sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        name: Resolve to one commit on main whose PUBLIC_PIN is the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.mirror.outputs.tag }}
          PUB_SHA: ${{ needs.mirror.outputs.public_sha }}
          RUN_SHA: ${{ needs.mirror.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is not a stable vX.Y.Z tag"; exit 1; }
          [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit $RUN_SHA"; exit 1; }
          sha="$RUN_SHA"
          if [ "$DRY_RUN" != true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "a real run needs main, not $GITHUB_REF"; exit 1; }
            pre=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease -q .isPrerelease)
            [ "$pre" = "false" ] || { echo "$TAG is a pre-release; no hosted release files"; exit 1; }
            # <tag>^{commit}, resolved once here; every later job checks out this SHA.
            ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
            tsha=$(jq -r .object.sha <<< "$ref")
            type=$(jq -r .object.type <<< "$ref")
            for _ in 1 2 3 4; do
              [ "$type" = tag ] || break
              obj=$(gh api "repos/$REPO/git/tags/$tsha")
              tsha=$(jq -r .object.sha <<< "$obj")
              type=$(jq -r .object.type <<< "$obj")
            done
            if [ "$type" != commit ] || ! [[ "$tsha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$TAG does not resolve to a commit"; exit 1
            fi
            [ "$tsha" = "$sha" ] || { echo "$TAG is $tsha, not this run's commit $sha"; exit 1; }
            target=$(gh api "repos/$REPO/releases/tags/$TAG" -q .target_commitish)
            if [[ "$target" =~ ^[0-9a-f]{40}$ ]] && [ "$target" != "$sha" ]; then
              echo "$TAG points at $sha but its release targets $target"; exit 1
            fi
          fi
          # L4: main's branch SHA, never the bare name (a tag named main would win).
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not read main"; exit 1; }
          status=$(gh api "repos/$REPO/compare/$main_sha...$sha" -q .status)
          case "$status" in
            behind|identical) ;;
            *) if [ "$DRY_RUN" = true ]; then echo "::warning::$sha is not on main (compare: $status); fine for a dry run"; else echo "$sha is not on main (compare: $status)"; exit 1; fi ;;
          esac
          # The hosted commit is built on exactly the public release the mirror checked.
          pin=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/PUBLIC_PIN?ref=$sha")
          [ "$(sed -n 's/^tag=//p' <<< "$pin")" = "$TAG" ] || { echo "PUBLIC_PIN at $sha is not $TAG"; exit 1; }
          [ "$(sed -n 's/^sha=//p' <<< "$pin")" = "$PUB_SHA" ] || { echo "PUBLIC_PIN at $sha is not public commit $PUB_SHA"; exit 1; }
          { echo "sha=$sha"; echo "public_sha=$PUB_SHA"; echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"
  hosted-build:
    needs: [hosted-guard]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          path: private
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ needs.hosted-guard.outputs.public_sha }}
          path: public
          persist-credentials: false
      # --auto-split: pre-split while the pinned public tree still holds the
      # hosted paths, strict after. It checks the pin and refuses a collision.
      - name: Overlay this repo onto the pinned public tree
        run: private/scripts/overlay.sh --auto-split public private
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: public/package.json
      # No dependency cache: a main-scoped pnpm store would feed the signed bytes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      - name: pnpm install
        working-directory: public
        run: pnpm install --frozen-lockfile
      # The server reports <version> only when v<version> points at HEAD, and a
      # checkout by SHA has no tags: fetch the public tag and check it is the
      # public commit. Public's tag, not this repo's: VERSION is the public
      # release's (one version everywhere).
      - name: Fetch the public release tag
        working-directory: public
        env:
          TAG: ${{ needs.hosted-guard.outputs.tag }}
          PUB_SHA: ${{ needs.hosted-guard.outputs.public_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$PUB_SHA"
      # The recorded commit is the public release's (overlay rule 4); the
      # lockfile is the merged one the overlay placed.
      - name: Build both variants and the release files, with manifest.json
        working-directory: public
        env:
          PUB_SHA: ${{ needs.hosted-guard.outputs.public_sha }}
        run: |
          pnpm --filter @oa/provision build
          pnpm --filter @oa/server build
          node --experimental-strip-types scripts/ci/build-hosted-release.ts "$RUNNER_TEMP/hosted" --commit "$PUB_SHA"
      - name: The built server reports exactly the release version
        working-directory: public
        env:
          VERSION: ${{ needs.hosted-guard.outputs.version }}
        run: grep -Fqx "export const VERSION = \"$VERSION\";" apps/server/src/version.gen.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
          if-no-files-found: error
          retention-days: 7
  hosted-check:
    needs: [hosted-guard, hosted-build]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && needs.hosted-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bundle_sha256: ${{ steps.check.outputs.bundle_sha256 }}
      manifest_sha256: ${{ steps.check.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          path: private
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ needs.hosted-guard.outputs.public_sha }}
          path: public
          persist-credentials: false
      # --auto-split: pre-split while the pinned public tree still holds the
      # hosted paths, strict after. It checks the pin and refuses a collision.
      - name: Overlay this repo onto the pinned public tree
        run: private/scripts/overlay.sh --auto-split public private
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: public/package.json
      # No dependency cache: a main-scoped pnpm store would feed the signed bytes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      - name: pnpm install
        working-directory: public
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      # The hashes are recomputed from the bytes check-no-test-hooks ran on,
      # before and after, and handed to hosted-sign.
      - id: check
        name: Verify manifest.json, then no test hooks in the release bundle
        working-directory: public
        run: |
          set -euo pipefail
          before=$(node --experimental-strip-types --no-warnings scripts/ci/check-hosted-release.ts "$RUNNER_TEMP/hosted")
          pnpm check-no-test-hooks "$RUNNER_TEMP/hosted/release"
          pnpm check-no-fake-idp "$RUNNER_TEMP/hosted/release"
          after=$(node --experimental-strip-types --no-warnings scripts/ci/check-hosted-release.ts "$RUNNER_TEMP/hosted")
          [ "$before" = "$after" ] || { echo "the artifact changed during the check"; exit 1; }
          echo "$after" >> "$GITHUB_OUTPUT"
  hosted-sign-staging:
    needs: [hosted-guard, hosted-build, hosted-check]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && needs.hosted-build.result == 'success' && needs.hosted-check.result == 'success' }}
    runs-on: ubuntu-latest
    # The staging key lives only in this GitHub Environment (main only, no admin bypass, no approval step). It signs in a dry run too.
    environment: hosted-staging
    permissions:
      contents: read
    concurrency:
      group: hosted-sign-staging-${{ needs.hosted-guard.outputs.tag }}
      cancel-in-progress: false
    outputs:
      staging_signed: ${{ steps.sign.outputs.staging_signed }}
      staging_release_signature: ${{ steps.sign.outputs.staging_release_signature }}
      staging_release_tar_sha256: ${{ steps.sign.outputs.staging_release_tar_sha256 }}
      staging_release_record_sha256: ${{ steps.sign.outputs.staging_release_record_sha256 }}
      staging_redline_signature: ${{ steps.sign.outputs.staging_redline_signature }}
      staging_redline_tar_sha256: ${{ steps.sign.outputs.staging_redline_tar_sha256 }}
      staging_redline_record_sha256: ${{ steps.sign.outputs.staging_redline_record_sha256 }}
    # Exactly these steps: no install, no other action beyond checkout, setup-node and download-artifact, node:* imports only.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          path: private
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ needs.hosted-guard.outputs.public_sha }}
          path: public
          persist-credentials: false
      # --auto-split: pre-split while the pinned public tree still holds the
      # hosted paths, strict after. It checks the pin and refuses a collision.
      - name: Overlay this repo onto the pinned public tree
        run: private/scripts/overlay.sh --auto-split public private
      # H-N22: Node 22 from .nvmrc via setup-node pinned by SHA, no cache;
      # plain .mjs, no strip-types. The key is only in the sign step's env.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      - name: Assert Node 22
        run: v=$(node --version); case "$v" in v22.*) ;; *) echo "expected Node 22, got $v" >&2; exit 1;; esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      - id: sign
        name: Sign (the key goes in on stdin only)
        working-directory: public
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGN_ENV: staging
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          PUB_SHA: ${{ needs.hosted-guard.outputs.public_sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_KEY" | node scripts/ci/sign-release.mjs --dir "$RUNNER_TEMP/hosted" --env "$SIGN_ENV" --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --bundle-sha256 "$BUNDLE_SHA256" --commit "$PUB_SHA" --lockfile pnpm-lock.yaml --out "$RUNNER_TEMP/signed" >> "$GITHUB_OUTPUT"
  hosted-sign-prod:
    needs: [hosted-guard, hosted-build, hosted-check]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && needs.hosted-build.result == 'success' && needs.hosted-check.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The prod key lives only in this GitHub Environment (main only, no admin bypass, no approval step: the checks before it are the gate). A dry run never uses it.
    environment: hosted-prod
    permissions:
      contents: read
    concurrency:
      group: hosted-sign-prod-${{ needs.hosted-guard.outputs.tag }}
      cancel-in-progress: false
    outputs:
      prod_signed: ${{ steps.sign.outputs.prod_signed }}
      prod_release_signature: ${{ steps.sign.outputs.prod_release_signature }}
      prod_release_tar_sha256: ${{ steps.sign.outputs.prod_release_tar_sha256 }}
      prod_release_record_sha256: ${{ steps.sign.outputs.prod_release_record_sha256 }}
    # Exactly these steps: no install, no other action beyond checkout, setup-node and download-artifact, node:* imports only.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          path: private
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ needs.hosted-guard.outputs.public_sha }}
          path: public
          persist-credentials: false
      # --auto-split: pre-split while the pinned public tree still holds the
      # hosted paths, strict after. It checks the pin and refuses a collision.
      - name: Overlay this repo onto the pinned public tree
        run: private/scripts/overlay.sh --auto-split public private
      # H-N22: Node 22 from .nvmrc via setup-node pinned by SHA, no cache;
      # plain .mjs, no strip-types. The key is only in the sign step's env.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      - name: Assert Node 22
        run: v=$(node --version); case "$v" in v22.*) ;; *) echo "expected Node 22, got $v" >&2; exit 1;; esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      - id: sign
        name: Sign (the key goes in on stdin only)
        working-directory: public
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGN_ENV: prod
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          PUB_SHA: ${{ needs.hosted-guard.outputs.public_sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_KEY" | node scripts/ci/sign-release.mjs --dir "$RUNNER_TEMP/hosted" --env "$SIGN_ENV" --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --bundle-sha256 "$BUNDLE_SHA256" --commit "$PUB_SHA" --lockfile pnpm-lock.yaml --out "$RUNNER_TEMP/signed" >> "$GITHUB_OUTPUT"
  hosted-attach-staging:
    needs: [hosted-guard, hosted-build, hosted-check, hosted-sign-staging]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && !inputs.dry_run && needs.hosted-check.result == 'success' && needs.hosted-sign-staging.result == 'success' && needs.hosted-sign-staging.outputs.staging_signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hosted-attach-staging-${{ needs.hosted-guard.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          path: private
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ needs.hosted-guard.outputs.public_sha }}
          path: public
          persist-credentials: false
      # --auto-split: pre-split while the pinned public tree still holds the
      # hosted paths, strict after. It checks the pin and refuses a collision.
      - name: Overlay this repo onto the pinned public tree
        run: private/scripts/overlay.sh --auto-split public private
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      # Rebuilt from the same verified bytes; refused unless the tar and the
      # record hash to what hosted-sign-staging signed and the signature verifies
      # (pinned key). Refuses if any staging asset is already on the release.
      # The release is this repo's, created by the mirror.
      - name: Attach the signed staging release files to the GitHub release
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.hosted-guard.outputs.tag }}
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          PUB_SHA: ${{ needs.hosted-guard.outputs.public_sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
          RELEASE: ${{ needs.hosted-sign-staging.outputs.staging_release_signature }}:${{ needs.hosted-sign-staging.outputs.staging_release_tar_sha256 }}:${{ needs.hosted-sign-staging.outputs.staging_release_record_sha256 }}
          REDLINE: ${{ needs.hosted-sign-staging.outputs.staging_redline_signature }}:${{ needs.hosted-sign-staging.outputs.staging_redline_tar_sha256 }}:${{ needs.hosted-sign-staging.outputs.staging_redline_record_sha256 }}
        run: |
          set -euo pipefail
          existing=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep '^oa-release-staging-' || true)
          [ -z "$existing" ] || { echo "the release already has staging assets: $existing"; exit 1; }
          node scripts/ci/assemble-release.mjs --dir "$RUNNER_TEMP/hosted" --env staging --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --bundle-sha256 "$BUNDLE_SHA256" --commit "$PUB_SHA" --lockfile pnpm-lock.yaml --out "$RUNNER_TEMP/signed" --release "$RELEASE" --redline "$REDLINE"
          gh release upload "$TAG" --repo "$REPO" "$RUNNER_TEMP"/signed/oa-release-staging-*
  hosted-attach-prod:
    needs: [hosted-guard, hosted-build, hosted-check, hosted-sign-prod]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && !inputs.dry_run && needs.hosted-check.result == 'success' && needs.hosted-sign-prod.result == 'success' && needs.hosted-sign-prod.outputs.prod_signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hosted-attach-prod-${{ needs.hosted-guard.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          path: private
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ needs.hosted-guard.outputs.public_sha }}
          path: public
          persist-credentials: false
      # --auto-split: pre-split while the pinned public tree still holds the
      # hosted paths, strict after. It checks the pin and refuses a collision.
      - name: Overlay this repo onto the pinned public tree
        run: private/scripts/overlay.sh --auto-split public private
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      # Rebuilt from the same verified bytes; refused unless the tar and the
      # record hash to what hosted-sign-prod signed and the signature verifies
      # (pinned key). Refuses if any prod asset is already on the release.
      # The release is this repo's, created by the mirror.
      - name: Attach the signed prod release files to the GitHub release
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.hosted-guard.outputs.tag }}
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          PUB_SHA: ${{ needs.hosted-guard.outputs.public_sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
          RELEASE: ${{ needs.hosted-sign-prod.outputs.prod_release_signature }}:${{ needs.hosted-sign-prod.outputs.prod_release_tar_sha256 }}:${{ needs.hosted-sign-prod.outputs.prod_release_record_sha256 }}
        run: |
          set -euo pipefail
          existing=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep '^oa-release-prod-' || true)
          [ -z "$existing" ] || { echo "the release already has prod assets: $existing"; exit 1; }
          node scripts/ci/assemble-release.mjs --dir "$RUNNER_TEMP/hosted" --env prod --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --bundle-sha256 "$BUNDLE_SHA256" --commit "$PUB_SHA" --lockfile pnpm-lock.yaml --out "$RUNNER_TEMP/signed" --release "$RELEASE"
          gh release upload "$TAG" --repo "$REPO" "$RUNNER_TEMP"/signed/oa-release-prod-*
  # Dry run only: what hosted-attach-staging would do, without a release. The
  # signed files are re-assembled from the verified bytes (assemble-release.mjs
  # refuses unless the signature verifies against the pinned key) and uploaded
  # as a workflow artifact. Compare its manifest.json file hashes with the
  # public-signed release of the same tag: they match except commit/lockfile.
  hosted-dry-run:
    needs: [hosted-guard, hosted-build, hosted-check, hosted-sign-staging]
    if: ${{ !cancelled() && needs.hosted-guard.result == 'success' && inputs.dry_run && needs.hosted-check.result == 'success' && needs.hosted-sign-staging.result == 'success' && needs.hosted-sign-staging.outputs.staging_signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.hosted-guard.outputs.sha }}
          path: private
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ needs.hosted-guard.outputs.public_sha }}
          path: public
          persist-credentials: false
      # --auto-split: pre-split while the pinned public tree still holds the
      # hosted paths, strict after. It checks the pin and refuses a collision.
      - name: Overlay this repo onto the pinned public tree
        run: private/scripts/overlay.sh --auto-split public private
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-release
          path: ${{ runner.temp }}/hosted
      - name: Assemble the signed staging release files (no release, no upload to it)
        working-directory: public
        env:
          VERSION: ${{ needs.hosted-guard.outputs.version }}
          PUB_SHA: ${{ needs.hosted-guard.outputs.public_sha }}
          MANIFEST_SHA256: ${{ needs.hosted-check.outputs.manifest_sha256 }}
          BUNDLE_SHA256: ${{ needs.hosted-check.outputs.bundle_sha256 }}
          RELEASE: ${{ needs.hosted-sign-staging.outputs.staging_release_signature }}:${{ needs.hosted-sign-staging.outputs.staging_release_tar_sha256 }}:${{ needs.hosted-sign-staging.outputs.staging_release_record_sha256 }}
          REDLINE: ${{ needs.hosted-sign-staging.outputs.staging_redline_signature }}:${{ needs.hosted-sign-staging.outputs.staging_redline_tar_sha256 }}:${{ needs.hosted-sign-staging.outputs.staging_redline_record_sha256 }}
        run: |
          set -euo pipefail
          node scripts/ci/assemble-release.mjs --dir "$RUNNER_TEMP/hosted" --env staging --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --bundle-sha256 "$BUNDLE_SHA256" --commit "$PUB_SHA" --lockfile pnpm-lock.yaml --out "$RUNNER_TEMP/signed" --release "$RELEASE" --redline "$REDLINE"
          ls -l "$RUNNER_TEMP/signed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-signed-staging-dry-run
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
          retention-days: 7
