# Staging only: makes the yearly per-creator Team and Business Stripe prices
# (test mode, idempotent; scripts/ops/stripe-prices.ts) and prints their ids.
# The Stripe test key is hosted-staging-deploy's STRIPE_SECRET_KEY; it never
# leaves this job. Main only. Dry run looks and creates nothing.
name: staging-stripe-prices
run-name: staging-stripe-prices ${{ inputs.dry_run && '(dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Look for the prices, create nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: staging-stripe-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    environment: hosted-staging-deploy
    timeout-minutes: 10
    steps:
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "dispatch staging-stripe-prices on main"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ops
            scripts/ci
            .github/hosted
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Load the hosted constants
        run: bash scripts/ci/hosted-constants.sh staging .github/hosted
      - name: Stripe yearly prices
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node --experimental-strip-types --no-warnings scripts/ops/stripe-prices.ts
