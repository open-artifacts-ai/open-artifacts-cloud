# The nightly red-line run (#1137): the latest release's own long suite, once per
# release, so idle nights use nothing. It skips while any red-line run is going
# and until staging runs the release. A run's result is the workflow's own
# record: no session watches it. Red keeps one `blocker` issue open, and green
# closes it; it sends no email, so P30, which opens an alert, doesn't run here.
# The gate accepts that on a scheduled run only (report.ts, runKindOf).
# Not a prod gate: staging-first-gate.sh reads runs of redline-staging.yml, and
# a run called from here isn't one. Every red-line run applies the gate, so a
# nightly is green only if every case passes, P30 aside. It never holds a
# candidate (cloud #264 step 2): its call has its own concurrency group, and a
# gate run cancels a running nightly first (redline-staging.yml `preempt`).
# A cancelled nightly is not recorded as run, so the next cron runs the
# release again; it still waits 3 h after any candidate run, so preemptions
# stay rare. Its T19 job runs every dashboard spec (t19_full: true); a gate
# run runs only the @gate ones.
name: redline-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: redline-nightly
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: plan
        name: Does this release need its run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/redline-nightly.ts plan --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
  redline:
    needs: pick
    if: needs.pick.outputs.run == 'true'
    # A called workflow's jobs can't hold more than this: id-token for the
    # redline job, `actions: read` for its t19 hand-off (the t19 job gets
    # only contents and actions, never id-token).
    # actions: write only because the callee's preempt job asks for it (a
    # called job can't hold more than its caller gives); in a called run that
    # job's steps after its first are skipped, so nothing here cancels a run.
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: ./.github/workflows/redline-staging.yml
    with:
      tag: ${{ needs.pick.outputs.tag }}
      t19_full: true
      # The long red-line suite: since cloud #264 step 2 the gate runs the
      # smoke, and the checks the red-line page moved to nightly run here.
      suite: full
    # By name, never inherit: only the four secrets the callee declares
    # (on.workflow_call.secrets). Undeclared, a called run's jobs got none
    # (t19-dry-run 43183209806); the t19 job references none of them.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REDLINE_PROD_R2_TOKEN: ${{ secrets.REDLINE_PROD_R2_TOKEN }}
      REDLINE_PROD_SCRIPTS_TOKEN: ${{ secrets.REDLINE_PROD_SCRIPTS_TOKEN }}
      REDLINE_STG_PROVISIONER_TOKEN: ${{ secrets.REDLINE_STG_PROVISIONER_TOKEN }}
  report:
    needs: [pick, redline]
    if: ${{ always() && (needs.pick.result != 'success' || needs.pick.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Keep the blocker issue in step
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pick.outputs.tag }}
          # A failed pick is reported too: a nightly never fails quietly.
          RESULT: ${{ needs.pick.result == 'success' && needs.redline.result || needs.pick.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types scripts/ci/redline-nightly.ts report --repo "$GITHUB_REPOSITORY" --tag "$TAG" --result "$RESULT" --run "$RUN"
      # After the run: a release gets one nightly, green or red. A cancelled
      # one (a release gate preempts it) is not recorded, so the next cron
      # runs the release again.
      - name: Record the release as run
        if: needs.pick.outputs.run == 'true' && (needs.redline.result == 'success' || needs.redline.result == 'failure')
        env:
          TAG: ${{ needs.pick.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ran"
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/ran/tag.txt"
      - if: needs.pick.outputs.run == 'true' && (needs.redline.result == 'success' || needs.redline.result == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redline-nightly-${{ needs.pick.outputs.tag }}
          path: ${{ runner.temp }}/ran/tag.txt
          if-no-files-found: error
          retention-days: 90
