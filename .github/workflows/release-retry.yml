# Reruns a failed release-chain run on its own (cloud #264). On 11-25 v0.246.1
# stalled because hosted-attach-prod failed at "Set up job" (a GitHub download
# outage) and nothing retried it. This covers every workflow on the path from
# a public release to prod: hosted-release, hosted-publish,
# staging-release-chain, deploy-hosted-platform and prod-release-chain
# (redline-staging has its own, redline-retry.yml, retried once).
# A failed run on main gets its FAILED jobs rerun (gh run rerun --failed), at
# most twice: at once on the failure event of attempt 1, and at once on the
# failure event of attempt 2. No pause before a rerun: the failure event is
# the trigger, never a clock. Attempt 3 is never retried: red there waits for
# a person, and the #428 note below is the alert. Not a whole
# rerun: these are release steps, not test runs (AGENTS.md's whole-rerun rule
# is for CI, so a flake can't hide). A whole hosted-release rerun re-runs
# hosted-attach-staging, which refuses ("the release already has staging
# assets"), so it could never recover; --failed keeps the jobs that succeeded,
# their outputs and attachments.
# One layer only: prod-release-chain waits on the deploy (" [c..]") and the
# prod publish (" [p..]") it dispatches, so those children are never retried
# here; the chain's failed jobs are, which dispatch the child again. Retrying
# both would start two prod deploys per failure. staging-release-chain waits
# for nothing, so its staging deploy (" [sc..]") is retried on its own.
# Retried: pushes, workflow_run events, and dispatches whose run-name has
# " [sc". A hand dispatch, and a hosted-release dry run, are left alone.
# Each retry notes the run on #428. The rerun uses the release App's token
# (actions: write, this repo only) from the main-only release-app Environment,
# so its completion fires the next workflow_run as a person's rerun does.
name: release-retry
on:
  workflow_run:
    workflows:
      - hosted-release
      - hosted-publish
      - staging-release-chain
      - deploy-hosted-platform
      - prod-release-chain
    types: [completed]
permissions: {}
concurrency:
  group: release-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt <= 2 &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.display_title, '(dry run)') &&
      (github.event.workflow_run.event != 'workflow_dispatch' ||
      contains(github.event.workflow_run.display_title, ' [sc'))
    runs-on: ubuntu-latest
    environment: release-app
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Rerun the failed jobs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
          echo "reran the failed jobs of run $RUN_ID (attempt $((ATTEMPT + 1)))"
      - name: Note it on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.event.workflow_run.html_url }}
          NAME: ${{ github.event.workflow_run.name }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          gh issue comment 428 --repo "$REPO" --body "Automatic rerun: $NAME ($TITLE) attempt $ATTEMPT failed, $URL. Attempt $((ATTEMPT + 1)) started; find the cause in attempt $ATTEMPT."
