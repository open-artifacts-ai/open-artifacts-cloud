# The staging half of the release chain (cloud #264 step 1): no manual
# dispatch between a published release and the red-line gate.
#   hosted-release -> hosted-publish (staging) -> THIS: deploy-hosted-platform
#   (env staging, the workflow's default targets) -> THIS: redline-staging (the
#   gate) -> prod-release-chain.yml (unchanged).
# The only triggers are completed hosted-publish and deploy-hosted-platform
# runs (workflow_run: main's copy of this file runs, and the head branch is
# main). scripts/ci/staging-release-chain.ts decides, from the event's own
# fields passed through env: (never into a script), whether to act:
# success only; a publish started by hosted-release (never a manual or prod
# publish); a deploy this chain dispatched (its `sc` chain id in the run name,
# so a manual, verify_only, partial-target or prod deploy never starts the
# gate); the tag is the newest release; and no run of the target workflow
# exists for the tag in any state (a failed one waits for a person). The
# dispatch job re-checks all that under a concurrency group keyed on the tag.
# The deploy and the gate each hold their own gates (release gate, platform
# tags, staging's Environment); this file only starts them, and waits for
# nothing.
# Beside the deploy's dispatch, the stage-prod job (moved from
# hosted-publish.yml, #264 step 6) copies a release just published to staging
# into prod's bucket, without its record, under hosted-publish's own rule (see
# the job), so staging's deploy no longer waits for that copy. Dispatches use the release App's installation token (actions:
# write), never the default token: GitHub raises no workflow_run event for a
# run the default token started, so this chain's second step and
# prod-release-chain would never fire. A run dispatched by the App is still
# a workflow_dispatch run, the event prod-release-chain and
# staging-first-gate.sh read.
# The red-line nightly yields to candidates (it skips while any red-line run is
# going), but a nightly already running holds the `redline` group, so the gate
# waits for it (up to about 150 min), and a second dispatch replaces a waiting one.
name: staging-release-chain

on:
  workflow_run:
    workflows: [hosted-publish, deploy-hosted-platform]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      go: ${{ steps.plan.outputs.go }}
      next: ${{ steps.plan.outputs.next }}
      tag: ${{ steps.plan.outputs.tag }}
      stage: ${{ steps.plan.outputs.stage }}
      stage_tag: ${{ steps.plan.outputs.stage_tag }}
    steps:
      - name: On main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "the chain runs on main only"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: plan
        name: What this event starts
        env:
          GH_TOKEN: ${{ github.token }}
          # The file, not the name: a run-name replaces the name (the deploy's is its title).
          WORKFLOW: ${{ github.event.workflow_run.path }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node --experimental-strip-types scripts/ci/staging-release-chain.ts plan --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --conclusion "$CONCLUSION" --event "$RUN_EVENT" --branch "$BRANCH" --title "$TITLE" --actor "$ACTOR" --run-id "$RUN_ID"
  stage-prod:
    # Uploads the release's files to prod's bucket while staging deploys and
    # the red-line runs, so the prod publish after the gate (hosted-publish.yml
    # publish-prod, dispatched by prod-release-chain.yml) writes only the
    # record: publish-release --stage-only stops before it, and with no record
    # nothing can install the version. If the gate fails the files stay
    # unused. Moved here from hosted-publish.yml (#264 step 6), so staging's
    # deploy no longer waits for this copy; it now runs beside the dispatch
    # job. The rule is hosted-publish's, unchanged (staging-release-chain.ts
    # plan, `stage`): every release published to staging by a run that did not
    # publish prod, a hand dispatch with env staging, an older tag and a tag
    # already deployed included. Not named publish-prod: the chain's
    # "published" check must not take it for the record. Best effort: if it
    # fails (or the plan's reads fail), publish-prod uploads what is missing.
    # The hosted-publish-prod group is publish-prod's too, across both files,
    # so the two never run at once (pruneStaged relies on it).
    name: stage-prod release ${{ needs.plan.outputs.stage_tag }}
    needs: plan
    if: needs.plan.outputs.stage == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: hosted-prod-deploy
    permissions:
      contents: read
      actions: read
    concurrency:
      group: hosted-publish-prod
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Runs only from main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      # main, overlaid on the public tree at PUBLIC_PIN.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: _cloud
          persist-credentials: false
      - uses: ./_cloud/.github/actions/overlay
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oa/provision build
      - name: Load the hosted constants
        run: bash scripts/ci/hosted-constants.sh prod .github/hosted
      - name: Release gate
        env:
          TAG: ${{ needs.plan.outputs.stage_tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/tag-passed-checks.sh prod "$TAG"
      # No staging-first gate: this writes no record, so no version becomes
      # installable. publish-prod keeps that gate for the record.
      - name: Write the token files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/hosted-publish-secrets"
          mkdir -m 700 "$dir"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is not set in this Environment"; exit 1; }
          printf '%s\n' "$CLOUDFLARE_API_TOKEN" > "$dir/token"
          bash scripts/ci/hosted-r2-key.sh "$dir/r2"
      - name: Stage the files (no record)
        env:
          TAG: ${{ needs.plan.outputs.stage_tag }}
          OA_HOSTED_TOKEN_FILE: ${{ runner.temp }}/hosted-publish-secrets/token
          OA_HOSTED_R2_FILE: ${{ runner.temp }}/hosted-publish-secrets/r2
          OA_HOSTED_ENVIRONMENT: hosted-prod-deploy
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm -s --filter @oa/hosted start publish-release --env prod --tag "$TAG" --stage-only
      - name: Remove the token files
        if: ${{ always() }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/hosted-publish-secrets"
          rm -f "$d/r2" "$d/token"
          rm -rf "$d"
          test ! -e "$d"

  dispatch:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: release-app
    # The dispatch uses the release App's installation token (actions: write,
    # minted below), not the default token: a run the default token starts
    # raises no workflow_run event, so nothing after the deploy would fire
    # (neither this chain's gate nor prod-release-chain after it). The job's own
    # token only reads the checkout.
    permissions:
      contents: read
    # One start per step and tag: a second event for the same tag waits, then
    # finds the run the first started and skips.
    concurrency:
      group: staging-release-chain-${{ needs.plan.outputs.next }}-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
            .github/hosted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: app
        name: Mint the dispatch token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Start the next workflow for the tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEXT: ${{ needs.plan.outputs.next }}
          TAG: ${{ needs.plan.outputs.tag }}
          CHAIN_ID: sc${{ github.run_id }}-${{ github.run_attempt }}
        run: node --experimental-strip-types scripts/ci/staging-release-chain.ts dispatch --repo "$GITHUB_REPOSITORY" --next "$NEXT" --tag "$TAG" --chain-id "$CHAIN_ID"
