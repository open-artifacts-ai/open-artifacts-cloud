# Deploys one env's hosted platform Workers (docs/ops/hosted.md) from a stable
# release tag, by hand or dispatched by prod-release-chain.yml (#1343, always
# env prod and every target): the platform D1 migrations, the auth and directory
# brokers, the provision token's read-back, the provisioner, dispatch, the
# scheduler, the inventory Worker, the Provisioning API and the
# zone wiring (DNS, routes, settings: planned, then applied in the same run).
# No one approves a run: the release gate (scripts/ci/tag-passed-checks.sh)
# refuses a tag unless every earlier check on it passed, and prod's
# deploys (every target list, #1412; not verify_only, which deploys nothing)
# also need a green redline-staging.yml run for the same tag (scripts/ci/staging-first-gate.sh)
# and staging's post-deploy smoke green at or after it
# (scripts/ci/staging-smoke-gate.sh, #1406). Each env has its own
# Environment (hosted-staging-deploy, hosted-prod-deploy) holding the
# same-named secrets (one Cloudflare token, CLOUDFLARE_API_TOKEN); only main
# may run it. The constants are main's .github/hosted/<env>.json and the
# resource ids are looked up by name in the run. The code deployed is the
# tag's, never the branch's. verify_only deploys and sets nothing: it reads the
# live Workers back and runs every check, and the zones stay plan only. Every
# run also reads back the token's own end date and opens an issue 30 days
# ahead (scripts/ci/deploy-token-expiry.sh).
# One version everywhere (#1040): the default is every target, in order. Any
# other list is break-glass: it needs a reason and opens an issue naming the
# run (verify_only is a check, so it needs neither). `billing` (the Stripe
# billing service, #1568) is a STAGING-ONLY target between directory-broker and
# provision-token: prod refuses it, so prod's list, bindings, routes and
# secrets are unchanged. The staging full list is the default list with
# billing in it (no reason needed); the default list itself stays every
# target prod has, so a default staging run leaves billing on its own tag
# (the tag read-back checks billing only when the run included it). Every Worker version is
# tagged with the release (the "workers/tag" annotation), which
# redline-staging.yml checks before it starts (scripts/ci/platform-tags.sh).
name: deploy-hosted-platform
run-name: deploy-hosted-platform ${{ inputs.env }} ${{ inputs.tag }}${{ inputs.chain_id && format(' [{0}]', inputs.chain_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Which env's Workers"
        required: true
        type: choice
        options: [staging, prod]
      tag:
        description: "Stable release tag to deploy (vX.Y.Z)"
        required: true
        type: string
      targets:
        description: "Comma-separated, in order: platform-db,auth-broker,directory-broker,billing (staging only),provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler"
        required: true
        default: "platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler"
        type: string
      reason:
        description: "Break-glass only: why not every target (required unless targets is the full list or verify_only)"
        required: false
        default: ""
        type: string
      verify_only:
        description: "Read back and check only; deploy and set nothing"
        required: true
        default: false
        type: boolean
      # The prod release chain's alone (prod-release-chain.yml, #1343): once
      # this run holds the concurrency group, before anything deploys, the tag
      # must be newer than the release prod's scheduler runs, so a manual
      # deploy of a newer tag that won the group is never downgraded.
      require_newer:
        description: "Release chain only: refuse unless the tag is newer than prod's scheduler"
        required: false
        default: false
        type: boolean
      # The chain's own id: the run-name carries it, so the chain finds
      # exactly the run it dispatched (scripts/ci/chain-dispatch.ts).
      chain_id:
        description: "Release chain only: the chain run's id, shown in the run name"
        required: false
        default: ""
        type: string
    # No workflow_call: a called workflow resolves a secret its caller does
    # not pass to an empty string, even when the job's Environment has it
    # (run 42109047045). A dispatched run reads every secret from its own
    # job's Environment (hosted-<env>-deploy), plus the repo's OA_OWNER_EMAIL.

# The public repo: the release and smoke gates read its releases, its tag
# commit, its release-please run and its deploy-staging.yml smoke from here;
# everything hosted (jobs, assets, red-line runs) is this repo's own.
env:
  PUBLIC_REPO: open-artifacts-ai/open-artifacts

# actions: read lets the release gate read release-please.yml's run and jobs
# (and the staging-first gate redline-staging.yml's runs); issues: write lets
# the token read-back open its expiry issue and a break-glass run its record.
permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: hosted-platform-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
    env:
      # Staging sign-ups are open for the M2 walk (user decision 2026-11-10,
      # cap 20/day); prod never gets it, so prod's true still refuses. Job
      # level: every step that reads the signups constant (Deploy and verify,
      # Scheduler, last) sees it.
      ALLOW_SIGNUPS: ${{ inputs.env == 'staging' && '1' || '' }}
      # Prod's sign-up steps (#40): the signup.<app> route, the i00000signup
      # broker entry, SIGNUP_BROKER_KEY and TURNSTILE_SITEKEY, only while the
      # repo variable PROD_SIGNUP_DEPLOY is "on" (unset: off). Read only on
      # prod; staging always does them (the scripts decide by env).
      PROD_SIGNUP_DEPLOY: ${{ inputs.env == 'prod' && vars.PROD_SIGNUP_DEPLOY == 'on' && '1' || '' }}
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          TARGETS: ${{ inputs.targets }}
          REASON: ${{ inputs.reason }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          OA_OWNER_EMAIL: ${{ secrets.OA_OWNER_EMAIL }}
          # Billing's Stripe secrets (#1568): only a staging run that includes the
          # billing target holds them; any other run (prod included) gets neither,
          # whatever its Environment has.
          STRIPE_SECRET_KEY: ${{ inputs.env == 'staging' && contains(format(',{0},', inputs.targets), ',billing,') && secrets.STRIPE_SECRET_KEY || '' }}
          STRIPE_WEBHOOK_SECRET: ${{ inputs.env == 'staging' && contains(format(',{0},', inputs.targets), ',billing,') && secrets.STRIPE_WEBHOOK_SECRET || '' }}
        run: |
          set -euo pipefail
          # Defense in depth: the env is checked here too.
          case "$DEPLOY_ENV" in staging | prod) ;; *) echo "env must be staging or prod"; exit 1 ;; esac
          # #1084: the scheduler needs the alert address. Refuse here, before
          # any target runs, so a run never stops halfway through the list.
          # Logs print the address normalized, and only the exact stored value
          # is masked, so it must already be in that form.
          case ",$TARGETS," in
            *,scheduler,*) [ -n "$OA_OWNER_EMAIL" ] || { echo "OA_OWNER_EMAIL is not set; the scheduler target needs it"; exit 1; } ;;
          esac
          # #1568: the billing target needs both Stripe secrets, test-mode shapes.
          # This check runs before any target, so a run that includes billing
          # without them (or with a live key) fails here, not after the earlier
          # targets deployed; verify only reads, so it needs neither. It checks
          # the secrets only: a tag cut before the billing migration lock was
          # frozen is refused later, at the billing target (billing-db.ts), after
          # the targets before it have deployed.
          case ",$TARGETS," in
            *,billing,*)
              if [ "${VERIFY_ONLY:-}" != true ]; then
                [ -n "$STRIPE_SECRET_KEY" ] || { echo "STRIPE_SECRET_KEY is not set in hosted-staging-deploy; the billing target needs it"; exit 1; }
                [ -n "$STRIPE_WEBHOOK_SECRET" ] || { echo "STRIPE_WEBHOOK_SECRET is not set in hosted-staging-deploy; the billing target needs it"; exit 1; }
                [[ "$STRIPE_SECRET_KEY" =~ ^(sk|rk)_test_[A-Za-z0-9]{8,255}$ ]] || { echo "STRIPE_SECRET_KEY must be a Stripe test-mode key (sk_test_ or rk_test_); a live key is refused"; exit 1; }
                [[ "$STRIPE_WEBHOOK_SECRET" =~ ^whsec_[A-Za-z0-9+/=_-]{8,255}$ ]] || { echo "STRIPE_WEBHOOK_SECRET must be a Stripe signing secret (whsec_...)"; exit 1; }
              fi ;;
          esac
          [[ ! "$OA_OWNER_EMAIL" =~ [[:upper:][:space:]] ]] || { echo "OA_OWNER_EMAIL must be trimmed and lowercase"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be a stable vX.Y.Z"; exit 1; }
          # Known targets only, each once, in dependency order: every bound
          # target before its binder (design v7 10.2). The scheduler is last
          # (#1343): nothing binds it, and its tag is the fleet's target, so a
          # run that stops before the scheduler step never moves the fleet; once
          # that step's first deploy has run, the fleet follows even if the run
          # goes red afterwards (#55).
          order="platform-db auth-broker directory-broker billing provision-token provisioner dispatch inventory provisioning zones scheduler"
          last=-1
          seen=""
          IFS=, read -ra list <<< "$TARGETS"
          [ "${#list[@]}" -gt 0 ] || { echo "no targets"; exit 1; }
          for t in "${list[@]}"; do
            i=0; pos=-1
            for o in $order; do [ "$o" = "$t" ] && pos=$i; i=$((i + 1)); done
            [ "$pos" -ge 0 ] || { echo "unknown target: $t"; exit 1; }
            case " $seen " in *" $t "*) echo "duplicate target: $t"; exit 1 ;; esac
            # Staging only: prod has no billing Worker, binding, route or secret.
            [ "$t" != billing ] || [ "$DEPLOY_ENV" = staging ] || { echo "billing is a staging-only target"; exit 1; }
            [ "$pos" -gt "$last" ] || { echo "targets out of order: $TARGETS"; exit 1; }
            last=$pos; seen="$seen $t"
          done
          # One version everywhere (#1040): fewer targets is break-glass and
          # needs a reason (the issue step records it); verify_only is a check.
          REASON="${REASON:-}"
          if [ "$TARGETS" != "platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler" ] && [ "$TARGETS" != "platform-db,auth-broker,directory-broker,billing,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler" ] && [ "${VERIFY_ONLY:-}" != true ]; then
            [ -n "${REASON//[[:space:]]/}" ] || { echo "targets other than the full list need a reason (break-glass)"; exit 1; }
          fi
          [ "${#REASON}" -le 500 ] || { echo "reason: 500 characters at most"; exit 1; }
          [[ "$REASON" != *$'\n'* && "$REASON" != *$'\r'* ]] || { echo "reason: one line"; exit 1; }
      # The gate is main's, like the deploy scripts; it runs before the tag's
      # code is checked out.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: The tag passed every earlier check
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .release-gate/scripts/ci/tag-passed-checks.sh "$DEPLOY_ENV" "$TAG"
          rm -rf .release-gate
      - name: Prod runs only from main
        if: ${{ inputs.env == 'prod' }}
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      # A break-glass deploy (fewer than every target) leaves a record: an
      # issue with the reason, the run and the actor; no secret, no email.
      - name: Record the break-glass deploy
        if: ${{ !inputs.verify_only && inputs.targets != 'platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler' && inputs.targets != 'platform-db,auth-broker,directory-broker,billing,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler' }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          TARGETS: ${{ inputs.targets }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/break-glass.md"
          printf 'Reason: %s\n\nRun: %s\n\nActor: %s\n' "$REASON" "$RUN_URL" "$ACTOR" > "$body"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Break-glass platform deploy: $DEPLOY_ENV $TAG $TARGETS" --body-file "$body"
      # The CLOUD tag, overlaid on the public tree at the tag's PUBLIC_PIN.
      # The action refuses a checkout that is not exactly the tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: _cloud
          persist-credentials: false
      - uses: ./_cloud/.github/actions/overlay
        with:
          exact-tag: ${{ inputs.tag }}
      # The deploy logic is this workflow's own commit on main (reviewed, and
      # the Environment allows only main); what it deploys is the tag's.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .deploy-logic
          sparse-checkout: |
            scripts/ops
            scripts/ci
            packages/provision/src
            apps/platform-db
            apps/billing
            .github/hosted
          persist-credentials: false
      # main's provision pins the broker's Google client; the auth-broker
      # target refuses any other.
      - name: Use main's deploy scripts
        run: |
          set -euo pipefail
          for f in deploy-hosted-platform.sh deploy-platform-worker.sh hosted-zones.sh platform-db.ts billing-db.ts check-migration-lock.mjs wrangler-env.ts broker-key.ts; do
            cp ".deploy-logic/scripts/ops/$f" "scripts/ops/$f"
          done
          cp .deploy-logic/packages/provision/src/wfp.ts "$RUNNER_TEMP/main-wfp.ts"
          mkdir "$RUNNER_TEMP/main-ci"
          for f in hosted-cf.sh hosted-constants.sh hosted-resource-ids.sh staging-first-gate.sh staging-smoke-gate.sh deploy-token-expiry.sh platform-tags.sh worker-tag.sh prod-release-chain.ts deploy-token-identity.sh; do
            cp ".deploy-logic/scripts/ci/$f" "$RUNNER_TEMP/main-ci/$f"
          done
          cp -R .deploy-logic/.github/hosted "$RUNNER_TEMP/main-ci/hosted"
          # main's migration pins: the tag may add a migration, never re-pin one.
          cp .deploy-logic/apps/platform-db/migration-lock.json "$RUNNER_TEMP/main-ci/migration-lock.json"
          cp .deploy-logic/apps/billing/migration-lock.json "$RUNNER_TEMP/main-ci/billing-migration-lock.json"
          rm -rf .deploy-logic
      # Staging first, automatic: EVERY prod deploy, whatever its target list
      # (#1412), deploys a tag only after redline-staging.yml passed it (within
      # 7 days; scripts/ci/staging-first-gate.sh states the contract). A
      # verify_only run with a partial list skips the gates: it deploys and sets
      # nothing (it reads the live Workers back), so it must stay usable to
      # check prod when the tag has no red-line, e.g. after an incident. A
      # verify_only run with the FULL list does not skip them (#1229): it can
      # write the fleet's platform_verified mark below, and a mark is a go for
      # the rollout, so the same gates stand before it.
      - name: Staging passed this tag
        if: ${{ inputs.env == 'prod' && (!inputs.verify_only || (inputs.targets == 'platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler' || inputs.targets == 'platform-db,auth-broker,directory-broker,billing,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler')) }}
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/main-ci/staging-first-gate.sh" "$TAG"
      # #1406: the same runs also need staging's post-deploy smoke green
      # at or after the tag (scripts/ci/staging-smoke-gate.sh).
      - name: Staging's smoke is green at or after this tag
        if: ${{ inputs.env == 'prod' && (!inputs.verify_only || (inputs.targets == 'platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler' || inputs.targets == 'platform-db,auth-broker,directory-broker,billing,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler')) }}
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/main-ci/staging-smoke-gate.sh" "$TAG"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build and test the Workers being deployed
        env:
          DEPLOY_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          pnpm --filter @oa/provision build
          pnpm --filter @oa/auth-broker --filter @oa/directory-broker --filter @oa/dispatch --filter @oa/scheduler --filter @oa/inventory --filter @oa/provisioner --filter @oa/provisioning --filter @oa/admin test
          # Staging's billing service and its Stripe core (#1568): staging only,
          # so prod's run builds and tests exactly what it did before.
          if [ "$DEPLOY_ENV" = staging ]; then pnpm --filter @oa/billing --filter @oa/billing-core test; fi
      # main's committed constants (account id, email, Google client ids),
      # and the alert address from the OA_OWNER_EMAIL secret (#1084: never
      # committed, masked in the log).
      - name: Load the hosted constants
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          OA_OWNER_EMAIL: ${{ secrets.OA_OWNER_EMAIL }}
        run: bash "$RUNNER_TEMP/main-ci/hosted-constants.sh" "$DEPLOY_ENV" "$RUNNER_TEMP/main-ci/hosted"
      # Before any Cloudflare read or write: the token must be the one pinned
      # as deploy_token_id in <env>.json (the Environment's, not a repo-level
      # fallback), and active.
      - name: The deploy token is the Environment's
        id: token_identity
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash "$RUNNER_TEMP/main-ci/deploy-token-identity.sh" "$DEPLOY_ENV" "$RUNNER_TEMP/main-ci/hosted"
      # The release chain (#1343) re-checks here, holding the concurrency
      # group and before anything deploys: prod's scheduler (the fleet's
      # target) must run an older release than the tag.
      - name: The tag is newer than prod's
        if: ${{ inputs.require_newer }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ "$DEPLOY_ENV" = prod ] || { echo "require_newer is for prod only"; exit 1; }
          current="$(bash "$RUNNER_TEMP/main-ci/worker-tag.sh" prod scheduler)"
          node --experimental-strip-types "$RUNNER_TEMP/main-ci/prod-release-chain.ts" require-newer --tag "$TAG" --current "$current"
      # The D1 and KV ids, the sending zone's tag and the Secrets Store id, by
      # exact name on the account (exactly one each); only for the targets
      # that use them (the store for provision-token and provisioner only).
      - name: Resolve the resource ids
        if: ${{ contains(format(',{0},', inputs.targets), ',platform-db,') || contains(format(',{0},', inputs.targets), ',auth-broker,') || contains(format(',{0},', inputs.targets), ',billing,') || contains(format(',{0},', inputs.targets), ',directory-broker,') || contains(format(',{0},', inputs.targets), ',provision-token,') || contains(format(',{0},', inputs.targets), ',provisioner,') || contains(format(',{0},', inputs.targets), ',dispatch,') || contains(format(',{0},', inputs.targets), ',scheduler,') || contains(format(',{0},', inputs.targets), ',inventory,') || contains(format(',{0},', inputs.targets), ',provisioning,') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TARGETS: ${{ inputs.targets }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash "$RUNNER_TEMP/main-ci/hosted-resource-ids.sh" "$DEPLOY_ENV"
      - id: deploy
        name: Deploy and verify
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
          TARGETS: ${{ inputs.targets }}
          VERIFY_ONLY: ${{ inputs.verify_only && '1' || '' }}
          # Every Worker version is tagged with the release (workers/tag).
          DEPLOY_TAG: ${{ inputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DIRECTORY_CLIENT_SECRET: ${{ secrets.GOOGLE_DIRECTORY_CLIENT_SECRET }}
          # The admin allowlist, `email:sub,...` (#1007): only the provisioning
          # target reads it, and refuses without it.
          ADMIN_IDENTITIES: ${{ secrets.ADMIN_IDENTITIES }}
          BROKER_PIN_FILE: ${{ runner.temp }}/main-wfp.ts
          MAIN_MIGRATION_LOCK: ${{ runner.temp }}/main-ci/migration-lock.json
          MAIN_BILLING_MIGRATION_LOCK: ${{ runner.temp }}/main-ci/billing-migration-lock.json
          # The OIDC principal's repository (inventory, staging's provisioning);
          # GITHUB_REPOSITORY (owner/repo) is the runner's own.
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          # Billing's Stripe secrets (#1568): only a staging run that includes the
          # billing target holds them; the target refuses without them and puts
          # them on oa-s-billing alone.
          STRIPE_SECRET_KEY: ${{ inputs.env == 'staging' && contains(format(',{0},', inputs.targets), ',billing,') && secrets.STRIPE_SECRET_KEY || '' }}
          STRIPE_WEBHOOK_SECRET: ${{ inputs.env == 'staging' && contains(format(',{0},', inputs.targets), ',billing,') && secrets.STRIPE_WEBHOOK_SECRET || '' }}
        run: |
          set -euo pipefail
          IFS=, read -ra list <<< "$TARGETS"
          for t in "${list[@]}"; do
            # Zones and the scheduler have steps of their own, after this one.
            [ "$t" = zones ] && continue
            [ "$t" = scheduler ] && continue
            echo "::group::$DEPLOY_ENV $t"
            bash scripts/ops/deploy-hosted-platform.sh "$DEPLOY_ENV" "$t"
            echo "::endgroup::"
          done
      # Plan, then apply (hosted-zones.sh refuses anything outside its fixed
      # set and reads every change back);
      # verify_only stays plan only. Both go to the job summary.
      - name: Zones
        if: ${{ contains(format(',{0},', inputs.targets), ',zones,') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          VERIFY_ONLY: ${{ inputs.verify_only && '1' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/ops/hosted-zones.sh "$DEPLOY_ENV" plan
          [ -n "$VERIFY_ONLY" ] || bash scripts/ops/hosted-zones.sh "$DEPLOY_ENV" apply
      # The scheduler, last (#1343): its tag is the fleet's target, so it moves
      # only once every other target, the zones included, has succeeded. The
      # canary smoke's two secrets (#1343) reach this step, and so only the
      # scheduler: the Environment's, put on oa-<p>-scheduler when set.
      - id: scheduler
        name: Scheduler, last
        if: ${{ contains(format(',{0},', inputs.targets), ',scheduler,') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env == 'prod' && 'hosted-prod-deploy' || 'hosted-staging-deploy' }}
          VERIFY_ONLY: ${{ inputs.verify_only && '1' || '' }}
          DEPLOY_TAG: ${{ inputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLEET_SMOKE_TOKEN: ${{ secrets.FLEET_SMOKE_TOKEN }}
          FLEET_SMOKE_SHARE_TO: ${{ secrets.FLEET_SMOKE_SHARE_TO }}
        run: bash scripts/ops/deploy-hosted-platform.sh "$DEPLOY_ENV" scheduler
      # One version everywhere (#1040, #1064): read every Worker's
      # "workers/tag" back after a full-list run, on prod as on staging. A
      # break-glass run (fewer targets) leaves the others on their own tag,
      # so it is not checked here.
      # It also runs when the deploy or the scheduler step failed (#55): the
      # scheduler's tag is the fleet's target, so a red run must say whether it
      # moved. Only after a deploy step ran, never after an earlier gate failed
      # or the run was cancelled.
      - id: platform_tags
        name: Every platform Worker runs the tag
        if: ${{ !cancelled() && (steps.deploy.outcome != 'skipped' || steps.scheduler.outcome != 'skipped') && (inputs.targets == 'platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler' || inputs.targets == 'platform-db,auth-broker,directory-broker,billing,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Staging's full list with billing: its Worker is read back too.
          PLATFORM_TAGS_BILLING: ${{ contains(format(',{0},', inputs.targets), ',billing,') && '1' || '' }}
        run: bash "$RUNNER_TEMP/main-ci/platform-tags.sh" "$DEPLOY_ENV" "$TAG"
      # The fleet's gate (#1229): only once every step above succeeded, the
      # scheduler's included, and the read-back passed, the platform D1 gets
      # platform_verified:<version>. The scheduler's fleet duty starts no job
      # for a target without it. A verify_only run with the FULL list marks too
      # (it deploys nothing, but its read-back proved the Workers serve the tag,
      # so it is how a stalled version is recovered); on prod it first passed
      # the two staging gates above, and a failed gate means no mark. A partial
      # verify_only run is ungated and never marks (the full-list condition).
      - name: Mark the platform verified
        if: ${{ success() && steps.platform_tags.outcome == 'success' && (inputs.targets == 'platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler' || inputs.targets == 'platform-db,auth-broker,directory-broker,billing,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types --no-warnings scripts/ops/platform-db.ts mark-verified "$DEPLOY_ENV" "$TAG"
      # A break-glass run (a partial list that deployed something) clears every
      # platform_verified mark, whatever its outcome: the platform is no longer
      # known to be one verified release, so the fleet holds until a full green
      # run marks it again. verify_only deploys nothing and never clears.
      - name: Clear the platform verified marks (break-glass)
        if: ${{ !cancelled() && !inputs.verify_only && inputs.targets != 'zones' && (steps.deploy.outcome != 'skipped' || steps.scheduler.outcome != 'skipped') && !(inputs.targets == 'platform-db,auth-broker,directory-broker,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler' || inputs.targets == 'platform-db,auth-broker,directory-broker,billing,provision-token,provisioner,dispatch,inventory,provisioning,zones,scheduler') }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types --no-warnings scripts/ops/platform-db.ts unmark-verified "$DEPLOY_ENV"
      # The token's own end date (provision's checkToken never sees it): an
      # issue naming only the secret, 30 days ahead.
      - name: The deploy token's expiry
        if: ${{ !cancelled() && steps.token_identity.outcome == 'success' }}
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/main-ci/deploy-token-expiry.sh" "$DEPLOY_ENV"
