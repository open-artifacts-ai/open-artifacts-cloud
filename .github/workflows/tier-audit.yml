# Lists prod's install Workers and whether each has a binding named TIER, by
# hand only (docs/ops/hosted.md, #218): GET calls through scripts/ci/tier-audit.sh,
# which prints script names, yes/no and counts, never a binding's value or
# type. Job logs are public. Only main may run it, in the prod Environment.
name: tier-audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: hosted-prod-deploy
    timeout-minutes: 10
    steps:
      - name: On main
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "dispatch tier-audit on main"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
            .github/hosted
          persist-credentials: false
      # main's committed constants; CLOUDFLARE_ACCOUNT_ID is used here.
      - name: Load the hosted constants
        run: bash scripts/ci/hosted-constants.sh prod .github/hosted > /dev/null
      - name: Read the dispatch namespace
        run: echo "DISPATCH_NAMESPACE=$(jq -er '.dispatch_namespace' .github/hosted/prod.json)" >> "$GITHUB_ENV"
      - name: List the TIER bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/tier-audit.sh
