# Keeps one open `blocker` issue "hosted-release failed" while the last real
# hosted-release run on main is red (#1782). A failed release run reaches
# nobody otherwise. A green real run closes the issue.
#
# - Red is `failure` or `timed_out`. `success` is green. `cancelled` is neither:
#   a hosted-release run on a PUBLIC_PIN push can be cancelled by a newer one,
#   and a missed release fails the next run loudly, which this alert catches.
#   `skipped` and anything else count as nothing. Each is logged.
# - A dry run (run-name "hosted-release (dry run)") is not counted either way:
#   it creates no release, so its result says nothing about the last real one.
# - Reads only the workflow_run event's own fields, passed through env: and
#   never interpolated into a script. No checkout, no install, no secret: the
#   default token with issues: write only. Public text: the repo, the run URL,
#   the sha and the conclusion, no log excerpts.
# - The concurrency group keeps two completions from opening two issues. GitHub
#   keeps one running and one pending run per group, so a third completion
#   replaces the pending one (cancel-in-progress: false only protects the
#   running one). A dropped completion can lose one "failed again" comment, not
#   the issue: the next red or green completion sets the state.
# - workflow_run runs only from the default branch's copy of this file.
# Named hosted-release-alert, not release-alert: the public repo's own
# release-alert.yml lands at .github/workflows/release-alert.yml in the overlay.
name: hosted-release-alert

on:
  workflow_run:
    workflows: [hosted-release]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: hosted-release-alert
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Keep the blocker issue in step
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: hosted-release failed
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          case "$DISPLAY_TITLE" in
            *"(dry run)")
              echo "Run $RUN is a dry run: not counted, nothing changed."
              exit 0 ;;
          esac
          case "$CONCLUSION" in
            failure | timed_out) result=red ;;
            success) result=green ;;
            cancelled)
              echo "Run $RUN was cancelled: neither red nor green, nothing changed (a missed release fails the next run, which this alert catches)."
              exit 0 ;;
            *)
              echo "Run $RUN ended '$CONCLUSION': not counted, nothing changed."
              exit 0 ;;
          esac
          open=$(gh issue list --repo "$REPO" --state open --label blocker --limit 100 --json number,title | jq -r --arg t "$TITLE" '[.[] | select(.title == $t) | .number][0] // empty')
          if [ "$result" = red ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$REPO" --body "Failed again ($CONCLUSION): $RUN at $SHA"
              echo "Red ($CONCLUSION): commented on #$open."
            else
              gh issue create --repo "$REPO" --title "$TITLE" --label blocker --body "The hosted-release workflow ended $CONCLUSION on main in $REPO. Run: $RUN Commit: $SHA Conclusion: $CONCLUSION"
              echo "Red ($CONCLUSION): opened the blocker issue."
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$REPO" --comment "Green again: $RUN at $SHA"
            echo "Green: closed #$open."
          else
            echo "Green: no open blocker issue, nothing to do."
          fi
