# The flaky tracker (cloud #447, #264). Tracking only: it reruns nothing and
# changes nothing that blocks. When a CI run, or a release gate (a
# redline-staging run dispatched on main), passes on attempt 2 or later, every
# test that failed on an earlier attempt of that same run (same head sha)
# failed and then passed with nothing changed. scripts/ci/flaky-tracker.ts
# reads the earlier attempts' failed job logs and records each such test, with
# its run link, as a sighting in one `flaky-sightings` issue (the store). A
# test seen in two runs within 7 days opens or bumps one open issue labelled
# `flaky`, with the run links and the last author of the test file (assigned
# when GitHub allows it, else named in plain text). The script says why the
# store is an issue. Public's CI has its own copy in the public repo:
# workflow_run can't see another repo's runs.
# Runs from forks (a PR from another repo) count too. This job still runs in
# this repo with this repo's code: it checks out github.sha (the default
# branch for workflow_run), never the fork's head, and runs nothing from the
# run under test. What a fork's run gives it (its title, branch, logs and the
# test names in them) is data: passed through env, never put in an
# expression inside a script, and made inert before it is written to an issue.
# Hourly, the same job reconciles: it tracks every run of the watched
# workflows created in the last 30 days (how long GitHub allows a rerun) and
# updated in the last 26 hours that passed after a failed attempt and is not
# in the store yet (same rules, same code), so a tracker run GitHub dropped
# loses no sighting. A listing of 1,000 runs or more (GitHub's limit for one
# query) is split into smaller creation ranges, and the reconcile fails if
# one second still has that many. A run already in the store adds nothing.
# The default token only: it reads the run's jobs and logs and the commits of
# the test files, and writes issues. No App, no secret, no Environment.
#
# TODO(lane 3): a run that calls redline-staging as a reusable workflow (the
# nightly today, a queue gate later) raises workflow_run under the caller's
# name, so this file never sees it. When the queue gate lands, add it to
# `workflows` below and read its called jobs the same way. Not built yet.
name: flaky-tracker
on:
  workflow_run:
    workflows: [CI, redline-staging]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
permissions: {}
jobs:
  track:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt > 1 &&
      (github.event.workflow_run.path == '.github/workflows/ci.yml' ||
      (github.event.workflow_run.path == '.github/workflows/redline-staging.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main')))
    # One group per repo, with no per-run part: tracker runs never overlap,
    # so two runs can't both open the same issue or store, or bump from a stale
    # body. On the job, so a skipped run (most CI completions) joins no group
    # and can't displace a pending one. queue: max keeps up to 100 pending
    # runs in order instead of only the newest; GitHub cancels any past that,
    # and the hourly reconcile tracks their runs. It can't be combined with
    # cancel-in-progress: true.
    concurrency:
      group: flaky-tracker
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Record the flaky tests
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          # The workflow by its file: workflow_run.name is the run-name, which
          # for redline-staging carries the tag ("redline-staging v0.247.0").
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          case "$WORKFLOW_PATH" in
            .github/workflows/ci.yml) WORKFLOW=CI ;;
            .github/workflows/redline-staging.yml) WORKFLOW=redline-staging ;;
            *) echo "not a watched workflow: $WORKFLOW_PATH"; exit 1 ;;
          esac
          node --experimental-strip-types scripts/ci/flaky-tracker.ts --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --run-id "$RUN_ID" --attempt "$ATTEMPT" --head-sha "$HEAD_SHA" --title "$TITLE"
      - name: Reconcile runs the tracker missed
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/flaky-tracker.ts --repo "$GITHUB_REPOSITORY" --reconcile
