name: CI
# Builds and tests the private packages on the overlay: the public repo at
# PUBLIC_PIN, with this repo copied on top by scripts/overlay.sh.
# No secrets, no environments, no deploys: those come at the cut-over (#1056).
on:
  pull_request:
  push:
    branches: [main, scaffold]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: overlay and sync tests
        run: scripts/overlay.test.sh

  overlay:
    runs-on: ubuntu-latest
    env:
      # Real-build tests fail instead of skipping when the build is missing.
      OA_REQUIRE_REAL_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: private
          persist-credentials: false
      - id: pin
        name: read PUBLIC_PIN
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^tag=//p' private/PUBLIC_PIN)
          sha=$(sed -n 's/^sha=//p' private/PUBLIC_PIN)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::PUBLIC_PIN tag '$tag' is not vX.Y.Z"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PUBLIC_PIN sha '$sha' is not a full sha"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          path: public
          persist-credentials: false
      - name: overlay (checks the pin, fails on any path collision)
        run: private/scripts/overlay.sh public private
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: public/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: public/.nvmrc
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml
      - name: pnpm install
        working-directory: public
        run: pnpm install --frozen-lockfile
      # What to build and test, from this repo's tracked files: private
      # packages, root-vitest tests (scripts/ci, scripts/ops) and private tests
      # inside public packages. Fails on a package without test or typecheck,
      # a test with no owning package, or an empty tree after the sync.
      - id: pkgs
        name: plan (private packages and tests)
        env:
          PLAN: ${{ runner.temp }}/plan
        run: |
          set -euo pipefail
          private/scripts/ci-plan.sh public private "$PLAN"
          echo "count=$(grep -c '' "$PLAN/packages.txt" || true)" >> "$GITHUB_OUTPUT"
          echo "dir=$PLAN" >> "$GITHUB_OUTPUT"
      - name: no private packages yet
        if: ${{ steps.pkgs.outputs.count == '0' }}
        run: |
          if [ -f private/SYNCED_FROM ]; then
            echo "::error::SYNCED_FROM exists but there are no private packages; the job must not pass empty"
            exit 1
          fi
          echo "::warning::No private packages in this tree yet (before the sync). Build, typecheck and test are skipped."
      - name: build
        if: ${{ steps.pkgs.outputs.count != '0' }}
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          f=()
          while IFS= read -r d; do f+=(--filter "{./$d}..."); done < "$PLAN/packages.txt"
          pnpm -r --if-present "${f[@]}" build
      # Each private package must define typecheck and test (ci-plan checks);
      # run them one by one, without --if-present, so each one visibly runs.
      - name: typecheck
        if: ${{ steps.pkgs.outputs.count != '0' }}
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          while IFS= read -r d; do
            echo "::group::typecheck $d"
            pnpm --filter "./$d" run typecheck
            echo "::endgroup::"
            echo "typecheck ran: $d"
          done < "$PLAN/packages.txt"
      - name: test (private packages)
        if: ${{ steps.pkgs.outputs.count != '0' }}
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          while IFS= read -r d; do
            echo "::group::test $d"
            pnpm --filter "./$d" run test
            echo "::endgroup::"
            echo "test ran: $d"
          done < "$PLAN/packages.txt"
      - name: test (private scripts/ci and scripts/ops)
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          mapfile -t t < "$PLAN/root-tests.txt"
          if [ "${#t[@]}" -eq 0 ]; then echo "no private root-vitest tests"; exit 0; fi
          pnpm exec vitest run "${t[@]}"
      - name: test (private tests inside public packages)
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: ../private/scripts/ci-public-tests.sh . "$PLAN"
