name: CI
# Builds and tests the private packages on the overlay: the public repo at
# PUBLIC_PIN, with this repo copied on top by scripts/overlay.sh.
# No secrets, no environments, no deploys: those come at the cut-over (#1056).
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, scaffold]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: overlay and sync tests
        run: scripts/overlay.test.sh

  overlay:
    runs-on: ubuntu-latest
    env:
      # Real-build tests fail instead of skipping when the build is missing.
      OA_REQUIRE_REAL_BUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: private
          persist-credentials: false
      - id: pin
        name: read PUBLIC_PIN
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^tag=//p' private/PUBLIC_PIN)
          sha=$(sed -n 's/^sha=//p' private/PUBLIC_PIN)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::PUBLIC_PIN tag '$tag' is not vX.Y.Z"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PUBLIC_PIN sha '$sha' is not a full sha"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          path: public
          persist-credentials: false
      # --auto-split decides from the pinned tree: while it still holds the
      # hosted paths (before the delete at cut-over F1) it removes them first
      # (--pre-split); once it holds none it is strict, so a collision fails.
      # A tree with only some of them fails. No hand-set flag.
      - name: overlay (checks the pin; pre-split or strict, from the pinned tree)
        run: private/scripts/overlay.sh --auto-split public private
      # Private tests read the hosted workflows at .github/workflows/. They
      # live there in this repo (C2), so the overlay above copied them into
      # the tree. place-workflows.sh places only what is still parked in
      # hosted-workflows/ (nothing now) and refuses an existing target.
      - name: place parked hosted workflows in the overlay tree
        run: private/scripts/place-workflows.sh private public
      # The root .nvmrc here serves jobs that check out only this repo; it
      # must stay public's at the pin.
      - name: .nvmrc matches public's at the pin
        run: cmp private/.nvmrc public/.nvmrc
      # Equivalence (#1056 B2): overlay(public@S minus private paths, this
      # repo) must equal public@S, S being SYNCED_FROM's sha. Before the first
      # sync there is no SYNCED_FROM and the script skips with a message.
      # SYNCED_FROM is required (B1 is done): it may be missing only while this
      # tree holds none of the listed paths. prev is the SYNCED_FROM of the
      # base this change lands on, so pin-check can prove that a moved
      # SYNCED_FROM carried the public fix (port check).
      - id: synced
        name: read SYNCED_FROM (and the base's)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=""
          if [ -e private/SYNCED_FROM ] || [ -L private/SYNCED_FROM ]; then
            [ -f private/SYNCED_FROM ] && [ ! -L private/SYNCED_FROM ] || { echo "::error::SYNCED_FROM exists but is not a regular file"; exit 1; }
            sha=$(sed -n 's/^sha=//p' private/SYNCED_FROM)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SYNCED_FROM sha '$sha' is not a full sha"; exit 1; }
          else
            held=$(private/scripts/listed-present.sh public private)
            if [ -n "$held" ]; then
              echo "::error::SYNCED_FROM is missing but this tree holds listed private paths: $held"
              exit 1
            fi
          fi
          prev=""
          if [ -n "$sha" ] && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            if body=$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/SYNCED_FROM?ref=$BASE_SHA" 2> "$RUNNER_TEMP/gh.err"); then
              prev=$(printf '%s\n' "$body" | sed -n 's/^sha=//p')
              [[ "$prev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the base's SYNCED_FROM sha '$prev' is not a full sha"; exit 1; }
            elif grep -q "Not Found" "$RUNNER_TEMP/gh.err"; then
              echo "the base has no SYNCED_FROM (first sync): no port check"
            else
              cat "$RUNNER_TEMP/gh.err"; echo "::error::cannot read the base's SYNCED_FROM"; exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.synced.outputs.sha != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: open-artifacts-ai/open-artifacts
          ref: ${{ steps.synced.outputs.sha }}
          path: public-synced
          persist-credentials: false
          fetch-depth: 0   # pin-check needs SYNCED_FROM and PUBLIC_PIN in one history
      # PUBLIC_PIN is tied to SYNCED_FROM while public holds the hosted paths:
      # the pin may lead the sync only if public did not touch them (cloud #5),
      # and a moved SYNCED_FROM must carry the public fix (port check).
      - if: ${{ steps.synced.outputs.sha != '' }}
        name: pin-check (PUBLIC_PIN is tied to SYNCED_FROM)
        env:
          PREV: ${{ steps.synced.outputs.prev }}
        run: |
          set -euo pipefail
          if [ -n "$PREV" ]; then
            private/scripts/pin-check.sh --prev "$PREV" public-synced private
          else
            private/scripts/pin-check.sh public-synced private
          fi
      - if: ${{ steps.synced.outputs.sha != '' }}
        name: equivalence (outside the private paths, the overlay equals public at SYNCED_FROM)
        run: private/scripts/equivalence.sh public-synced private
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: public/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: public/.nvmrc
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml
      - name: pnpm install
        working-directory: public
        run: pnpm install --frozen-lockfile
      # What to build and test, from this repo's tracked files: private
      # packages, root-vitest tests (scripts/ci, scripts/ops, scripts/audit) and private tests
      # inside public packages. Fails on a package without test or typecheck,
      # a test with no owning package, or an empty tree after the sync.
      - id: pkgs
        name: plan (private packages and tests)
        env:
          PLAN: ${{ runner.temp }}/plan
        run: |
          set -euo pipefail
          private/scripts/ci-plan.sh public private "$PLAN"
          echo "count=$(grep -c '' "$PLAN/packages.txt" || true)" >> "$GITHUB_OUTPUT"
          echo "dir=$PLAN" >> "$GITHUB_OUTPUT"
      - name: no private packages yet
        if: ${{ steps.pkgs.outputs.count == '0' }}
        run: |
          if [ -f private/SYNCED_FROM ]; then
            echo "::error::SYNCED_FROM exists but there are no private packages; the job must not pass empty"
            exit 1
          fi
          echo "::warning::No private packages in this tree yet (before the sync). Build, typecheck and test are skipped."
      - name: SYNCED_FROM is required once there are private packages
        if: ${{ steps.pkgs.outputs.count != '0' && steps.synced.outputs.sha == '' }}
        run: |
          echo "::error::the plan found private packages but there is no SYNCED_FROM: no pin tie and no equivalence check would run"
          exit 1
      - name: build
        if: ${{ steps.pkgs.outputs.count != '0' }}
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          f=()
          while IFS= read -r d; do f+=(--filter "{./$d}..."); done < "$PLAN/packages.txt"
          pnpm -r --if-present "${f[@]}" build
      # Each private package must define typecheck and test (ci-plan checks);
      # run them one by one, without --if-present, so each one visibly runs.
      - name: typecheck
        if: ${{ steps.pkgs.outputs.count != '0' }}
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          while IFS= read -r d; do
            echo "::group::typecheck $d"
            pnpm --filter "./$d" run typecheck
            echo "::endgroup::"
            echo "typecheck ran: $d"
          done < "$PLAN/packages.txt"
      - name: test (private packages)
        if: ${{ steps.pkgs.outputs.count != '0' }}
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          while IFS= read -r d; do
            echo "::group::test $d"
            pnpm --filter "./$d" run test
            echo "::endgroup::"
            echo "test ran: $d"
          done < "$PLAN/packages.txt"
      - name: test (private scripts/ci, scripts/ops and scripts/audit)
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: |
          set -euo pipefail
          mapfile -t t < "$PLAN/root-tests.txt"
          if [ "${#t[@]}" -eq 0 ]; then echo "no private root-vitest tests"; exit 0; fi
          pnpm exec vitest run "${t[@]}"
      - name: test (private tests inside public packages)
        working-directory: public
        env:
          PLAN: ${{ steps.pkgs.outputs.dir }}
        run: ../private/scripts/ci-public-tests.sh . "$PLAN"

  # The overlay prelude the hosted workflows use (.github/actions/overlay),
  # run for real: this repo at _cloud, then the action. Proves the tree lands
  # at the workspace root and the later steps' relative paths hold.
  overlay-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: _cloud
          persist-credentials: false
      - uses: ./_cloud/.github/actions/overlay
      - name: the merged tree is at the workspace root
        run: |
          set -euo pipefail
          test -f package.json
          test -f scripts/ci/tag-passed-checks.sh
          test -f .github/workflows/deploy-hosted-platform.yml
          test -f .github/hosted/staging.json
          test -d apps/provisioning
          test -f pnpm-lock.yaml
          test -f .nvmrc
          test ! -e _public
          test -d _cloud/.git
          test "$(git rev-parse HEAD)" = "$(sed -n 's/^sha=//p' _cloud/PUBLIC_PIN)"
