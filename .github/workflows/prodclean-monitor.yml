# The prod-clean monitor (design v7 6): red-line's prodClean against
# prod, the scheduler's dead-man tick and the red-line prod tokens' expiry.
# It reads the prod inventory with a GitHub OIDC token (no stored key). The
# repo is public, so the log shows only `prod-clean: pass` or
# `prod-clean: fail (<code>)`; the detail goes to the prod inventory (POST
# /prodclean), and the scheduler alerts and emails from there. A failed run
# is the alert here: no issue is opened (that needs issues: write).
#
# Two jobs that check, so no installer or build tool runs where an OIDC
# token can be minted (and a relay that starts them, below):
# - build: contents: read only, no environment, no secrets. It installs,
#   builds and bundles the monitor script into one self-contained ESM file,
#   smoke-runs it, and uploads it. Nothing here can mint a JWT, but the
#   monitor job trusts this bundle as built (and the runtime dependencies
#   inlined in it), so this whole job is inside the trust boundary.
# - monitor: id-token: write only, in the redline-staging Environment (main
#   only). No checkout, no install, no build: only setup-node and
#   download-artifact, then node runs the bundle. Secrets come only from the
#   Environment, as 0600 files under RUNNER_TEMP, never as argv.
name: prodclean-monitor

# Runs from this repo since the cut-over (#1056): prod inventory trusts this
# repo, and the public repo's monitor is disabled, so there is one monitor.
# No clock (cloud #264): it checks after the events that can change prod's
# state, and on dispatch. The token-expiry check runs with it.
# - A prod deploy-hosted-platform run on main completes (a person's dispatch),
#   or prod-release-chain completes (it dispatches the prod deploy with the
#   default token, and a run that token starts raises no workflow_run event:
#   staging-release-chain.yml says why it uses the App's token instead).
# - A redline-staging run on main completes.
# Any conclusion: a failed deploy may have changed prod too. The prod
# inventory admits a monitor token only from a schedule or workflow_dispatch
# run (@oa/gh-oidc GITHUB_OIDC_EVENT_NAMES, fixed for every caller), so on
# workflow_run only the relay job runs: it dispatches this workflow on main,
# and build and monitor run in that dispatched run. Each check only reads prod
# and posts one report, so an extra run changes nothing.
on:
  workflow_run:
    workflows: [deploy-hosted-platform, prod-release-chain, redline-staging]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  # workflow_run always runs the default branch, so the run that completed
  # must be this repo's, on main. A staging deploy (its run-name names the
  # env) is skipped. Workflows are matched by file, never workflow_run.name.
  # It passes nothing from the event to the dispatch.
  relay:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'open-artifacts-ai/open-artifacts-cloud' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.path == '.github/workflows/redline-staging.yml' ||
      github.event.workflow_run.path == '.github/workflows/prod-release-chain.yml' ||
      (github.event.workflow_run.path == '.github/workflows/deploy-hosted-platform.yml' &&
      startsWith(github.event.workflow_run.display_title, 'deploy-hosted-platform prod ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: write is this job's alone: it dispatches the monitor.
    permissions:
      actions: write
    steps:
      - name: Start the monitor on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prodclean-monitor.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: >-
      github.repository == 'open-artifacts-ai/open-artifacts-cloud' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # main, overlaid on the public tree at PUBLIC_PIN.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: _cloud
          persist-credentials: false
      - uses: ./_cloud/.github/actions/overlay
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Builds @oa/shared too.
      - run: pnpm --filter @oa/provision build
      # One ESM file with every dependency inlined (node builtins only).
      - run: pnpm --filter @oa/inventory bundle:monitor
      # The bundle must run as a script: with no env it fails closed, before
      # any network call. A bundle that silently does nothing would show green.
      - name: Smoke-run the bundle
        run: |
          set +e
          out="$(env -i PATH="$PATH" node apps/inventory/dist/prodclean-monitor.mjs 2>&1)"
          code=$?
          set -e
          [ "$out" = "prod-clean: fail (not_configured)" ] && [ "$code" -ne 0 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prodclean-monitor
          path: apps/inventory/dist/prodclean-monitor.mjs
          retention-days: 1
          if-no-files-found: error

  monitor:
    needs: build
    if: >-
      github.repository == 'open-artifacts-ai/open-artifacts-cloud' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    # One check at a time. On the job, not the workflow: a relay run joins no
    # group, so it can't displace a pending check. A newer pending check may
    # replace an older one; it reads the newer state.
    concurrency:
      group: prodclean-monitor
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: redline-staging
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      # The same version as .nvmrc (a test checks it): no checkout here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prodclean-monitor
          path: ${{ runner.temp }}/prodclean-bundle
      # Only this step sees the secrets. An empty one writes no file, and the
      # monitor fails not_configured.
      - name: Write the red-line prod token files
        env:
          PROD_R2_TOKEN: ${{ secrets.REDLINE_PROD_R2_TOKEN }}
          PROD_SCRIPTS_TOKEN: ${{ secrets.REDLINE_PROD_SCRIPTS_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/prodclean-secrets"
          mkdir -m 700 "$d"
          if [ -n "${PROD_R2_TOKEN:-}" ]; then printf '%s' "$PROD_R2_TOKEN" > "$d/REDLINE_PROD_R2_TOKEN"; fi
          if [ -n "${PROD_SCRIPTS_TOKEN:-}" ]; then printf '%s' "$PROD_SCRIPTS_TOKEN" > "$d/REDLINE_PROD_SCRIPTS_TOKEN"; fi
      # The runner gives this step ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN;
      # the script mints the JWT for the prod inventory's audience itself.
      - name: Prod is clean
        env:
          INVENTORY_URL: ${{ vars.REDLINE_PROD_INVENTORY_URL }}
          # The prod inventory's OIDC_AUDIENCE (apps/inventory/wrangler.jsonc).
          INVENTORY_OIDC_AUDIENCE: https://oa-p-inventory
          REDLINE_PROD_ACCOUNT_ID: ${{ vars.REDLINE_PROD_ACCOUNT_ID }}
          REDLINE_PROD_SECRETS_DIR: ${{ runner.temp }}/prodclean-secrets
          NODE_NO_WARNINGS: "1"
        run: node "$RUNNER_TEMP/prodclean-bundle/prodclean-monitor.mjs"
      - name: Remove the token files
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/prodclean-secrets"
