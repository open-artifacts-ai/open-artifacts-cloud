# Reads one Worker's Workers Logs over a narrow window and prints only counts
# and error classes with message hashes (the repo is public, so is this
# log). By hand only. Token: oa-x-ci-ro, gh:cf-read/CF_READ_TOKEN
# cf-read is limited to deployment branch main (custom policy, one rule
# main:branch, verified 2026-11-18 via the environments API); any change to
# that rule needs Axe review.
# (docs/ops/hosted.md, "Reading one Worker's logs as counts").
name: cf-logs

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker name: oa-p-*, oa-s-*, open-artifacts-prod or open-artifacts-staging"
        required: true
        type: string
      since:
        description: "Window start, ISO8601 UTC, e.g. 2026-11-18T10:00:00Z"
        required: true
        type: string
      minutes:
        description: "Window length in minutes (1..120)"
        required: false
        default: "30"
        type: string
      filter:
        description: "Which events to count"
        required: false
        default: errors
        type: choice
        options:
          - errors
          - status5xx
          - all

permissions: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: cf-read
    timeout-minutes: 5
    steps:
      - name: Validate inputs
        env:
          WORKER: ${{ inputs.worker }}
          SINCE: ${{ inputs.since }}
          MINUTES: ${{ inputs.minutes }}
        shell: bash
        run: |
          set -euo pipefail
          nl=$'\n'
          [[ "$WORKER" != *"$nl"* && "$SINCE" != *"$nl"* && "$MINUTES" != *"$nl"* ]] \
            || { echo "no newlines in inputs"; exit 1; }
          # Platform Workers only (apps/*/wrangler.jsonc), never an install's.
          [[ $WORKER =~ ^(oa-[ps]-(dispatch|provisioning|scheduler|provisioner|inventory|billing)|open-artifacts-(prod|staging))$ ]] \
            || { echo "worker not allowed"; exit 1; }
          [[ $SINCE =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "since must be ISO8601 UTC, like 2026-11-18T10:00:00Z"; exit 1; }
          [[ $MINUTES =~ ^[0-9]{1,3}$ ]] \
            || { echo "minutes must be 1..120"; exit 1; }
          (( 10#$MINUTES >= 1 && 10#$MINUTES <= 120 )) \
            || { echo "minutes must be 1..120"; exit 1; }
      - name: Count by status and by error
        env:
          CF_READ_TOKEN: ${{ secrets.CF_READ_TOKEN }}
          WORKER: ${{ inputs.worker }}
          SINCE: ${{ inputs.since }}
          MINUTES: ${{ inputs.minutes }}
          FILTER: ${{ inputs.filter }}
          ACCOUNT: 26ac346086d4405f7a976d48747a2a75
        shell: bash
        run: |
          set -euo pipefail
          FROM=$(( $(date -u -d "$SINCE" +%s) * 1000 ))
          TO=$(( FROM + 10#$MINUTES * 60000 ))
          URL="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/observability/telemetry/query"

          # Public log: never print error text. Each error becomes its class
          # (leading identifier up to ':' or a space, else "error") and the
          # first 8 hex of the sha256 of the full message. Reads "count<TAB>msg".
          errline() {
            local n msg class
            while IFS=$'\t' read -r n msg; do
              if [[ $msg =~ ^([A-Za-z_][A-Za-z0-9_]{0,39})([:\ ]|$) ]]; then
                class=${BASH_REMATCH[1]}
              else
                class=error
              fi
              printf -- '- %s: %s #%s\n' "$n" "$class" \
                "$(printf '%s' "$msg" | sha256sum | cut -c1-8)"
            done
          }

          # $1 label, $2 group-by field, $3 group-by type, $4 limit.
          query() {
            body=$(jq -n --arg w "$WORKER" --arg f "$FILTER" \
              --argjson from "$FROM" --argjson to "$TO" \
              --arg g "$2" --arg gt "$3" --argjson lim "$4" '
              {queryId: "cf-logs", timeframe: {from: $from, to: $to}, view: "calculations",
               parameters: {
                 calculations: [{operator: "count", alias: "n"}],
                 groupBys: [{type: $gt, value: $g}],
                 orderBy: {value: "n", order: "desc"},
                 limit: $lim,
                 filters:
                   ([{key: "$metadata.service", operation: "eq", type: "string", value: $w}]
                    + (if $f == "errors" then [{key: "$metadata.error", operation: "exists", type: "string"}]
                       elif $f == "status5xx" then [{key: "$metadata.statusCode", operation: "gte", type: "number", value: 500}]
                       else [] end))}}')
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer $CF_READ_TOKEN" -H 'Content-Type: application/json' \
              --data "$body") || { echo "::error::call '$1' failed to connect"; exit 1; }
            if [ "$code" != 200 ]; then
              cfcode=$(jq -r '.errors[0].code // "none"' resp.json 2>/dev/null || echo none)
              echo "::error::call '$1' (POST workers/observability/telemetry/query) failed: HTTP $code, Cloudflare error code $cfcode (token missing Workers Observability read?)"
              exit 1
            fi
          }

          # Fails when the response has no .result.calculations array (a wrong
          # path or shape must not read as "no errors"). Prints "count<TAB>value"
          # rows, or a single "0<TAB>none" row when there are truly none.
          rows() {
            jq -e '.result.calculations | type == "array"' resp.json > /dev/null \
              || { echo "::error::call '$1': no result.calculations in the response"; exit 1; }
            jq -r '(.result.calculations[0].aggregates // []) as $a
              | if ($a | length) == 0 then "0\tnone"
                else $a[] | "\(.count // .value)\t\(.groups[0].value // "none" | tostring | gsub("[\\r\\n\\t]"; " "))" end' resp.json
          }

          {
            echo "### cf-logs: $WORKER"
            echo "Window: $SINCE + $MINUTES min, filter: $FILTER"
            echo
            # shellcheck disable=SC2016  # jq field names, not shell variables
            query "count by status" '$metadata.statusCode' number 50
            echo "Count by HTTP status (events matching the filter):"
            rows "count by status" \
              | awk -F'\t' '{ s = ($2 ~ /^[0-9]+$/ || $2 == "none") ? $2 : "other"; printf "- status %s: %s\n", s, $1 }'
            echo
            # shellcheck disable=SC2016  # jq field names, not shell variables
            query "count by error" '$metadata.error' string 10
            echo "Top 10 errors (class and message hash only, no text):"
            if [ "$(rows "count by error" | head -n1)" = $'0\tnone' ]; then
              echo "- 0 errors"
            else
              rows "count by error" | errline
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
