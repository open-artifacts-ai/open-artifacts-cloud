# #2208, staging and Stripe test mode only: read the Stripe Customer Portal
# configurations, or make the one Open Artifacts uses (seats and plan changes
# off, cancel at period end, payment method and invoice history on).
#   portal-read:   print each configuration's id, whether it is the default,
#                  and its four features (on or off). Nothing else.
#   portal-ensure: create or update the one configuration with metadata oa=billing;
#                  print only its bpc_ id.
# The Stripe test key is hosted-staging-deploy's STRIPE_SECRET_KEY; it never
# leaves this job and is checked to be a test key (scripts/ops/staging-portal-config.ts).
# Staging only, main only.
name: staging-portal-config
run-name: staging-portal-config ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "print the portal configurations, or create or update ours"
        required: true
        type: choice
        options:
          - portal-read
          - portal-ensure

permissions:
  contents: read

concurrency:
  group: staging-portal-config
  cancel-in-progress: false

jobs:
  portal:
    runs-on: ubuntu-latest
    environment: hosted-staging-deploy
    timeout-minutes: 5
    steps:
      - name: Check the inputs
        env:
          REF: ${{ github.ref }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "dispatch staging-portal-config on main"; exit 1; }
          case "$ACTION" in portal-read | portal-ensure) ;; *) echo "action is portal-read or portal-ensure"; exit 1 ;; esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ops
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The cloud repo has no .nvmrc of its own; this job runs only node
          # built-ins, so pin the major.
          node-version: "22"
      - name: Portal configuration
        env:
          ACTION: ${{ inputs.action }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node --experimental-strip-types --no-warnings scripts/ops/staging-portal-config.ts
