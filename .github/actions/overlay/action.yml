name: overlay
description: >
  Builds the hosted workspace at the workspace root: the public repo at the
  PUBLIC_PIN of this repo's checkout, with this repo copied on top by
  scripts/overlay.sh (--auto-split). Run it after checking this repo out at
  path _cloud, at the ref the job runs (main's sha or a release tag). Leaves
  the overlay tree at the root (its own .git is the public checkout), so
  later steps use the same relative paths as in the public repo. The _cloud
  checkout stays in place, untracked (the runner needs this action's files
  there until the job ends).
inputs:
  exact-tag:
    description: "Optional vX.Y.Z: fail unless _cloud is exactly this tag and clean"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: pin
      name: Read PUBLIC_PIN
      shell: bash
      env:
        EXACT_TAG: ${{ inputs.exact-tag }}
      run: |
        set -euo pipefail
        [ -f _cloud/PUBLIC_PIN ] || { echo "::error::_cloud/PUBLIC_PIN is missing: check this repo out at path _cloud first"; exit 1; }
        if [ -n "$EXACT_TAG" ]; then
          [[ "$EXACT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::exact-tag must be vX.Y.Z"; exit 1; }
          test "$(git -C _cloud describe --tags --exact-match)" = "$EXACT_TAG"
          test -z "$(git -C _cloud status --porcelain)"
        fi
        tag=$(sed -n 's/^tag=//p' _cloud/PUBLIC_PIN)
        sha=$(sed -n 's/^sha=//p' _cloud/PUBLIC_PIN)
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::PUBLIC_PIN tag '$tag' is not vX.Y.Z"; exit 1; }
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PUBLIC_PIN sha '$sha' is not a full sha"; exit 1; }
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: open-artifacts-ai/open-artifacts
        ref: refs/tags/${{ steps.pin.outputs.tag }}
        path: _public
        persist-credentials: false
    - name: Overlay (checks the pin; pre-split or strict, from the pinned tree)
      shell: bash
      run: |
        set -euo pipefail
        _cloud/scripts/overlay.sh --auto-split _public _cloud
        # The merged tree becomes the workspace root. dotglob moves .git and
        # .nvmrc too. _cloud stays where it is: the runner reads this action's
        # files from it again in the post-job step.
        shopt -s dotglob
        for f in _public/*; do
          [ ! -e "./${f#_public/}" ] || { echo "::error::${f#_public/} already exists in the workspace"; exit 1; }
          mv "$f" .
        done
        rmdir _public
